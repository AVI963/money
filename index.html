<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>הכסף שלי</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#0b1220;--mut:#6b7686;--line:#e6eaef;--g:#12b76a;--gs:#e3f6ec;--r:#f04438;--rs:#fdeceb;--b:#4f6bed}
@media(prefers-color-scheme:dark){:root{--bg:#0b1118;--card:#141c26;--ink:#eef2f6;--mut:#8b97a8;--line:#232d3a;--gs:#12372a;--rs:#3a1b1a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Heebo,system-ui,Arial,sans-serif;padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:6px 16px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 0}header b{font-size:20px;font-weight:800}
header button{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);font-size:17px;margin-inline-start:8px;cursor:pointer;box-shadow:0 2px 8px -4px #0004;color:var(--ink)}
.view{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.view{animation:none}}
.bn{background:var(--card);border-radius:14px;padding:8px 12px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bn button{border:0;background:var(--g);color:#fff;border-radius:10px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.card{background:var(--card);border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 8px 24px -16px #0b122044}
.mp{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 14px}.mp strong{background:var(--card);border-radius:99px;padding:8px 22px;font-size:16px;box-shadow:0 2px 10px -6px #0006}
.mp button{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);font-size:16px;cursor:pointer;color:var(--ink)}.mp button:disabled{opacity:.25}
.lb{color:var(--mut);font-size:14px}.big{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:500;background:var(--gs);color:var(--g)}.chip.bad{background:var(--rs);color:var(--r)}
.trio{display:flex;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.trio div{flex:1;text-align:center}.trio b{display:block;font-size:17px}.trio div+div{border-inline-start:1px solid var(--line)}
.bars{display:flex;gap:8px;height:130px;direction:ltr;position:relative;margin-top:10px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;gap:5px;height:100%;position:relative;z-index:1}
.bars b{width:100%;max-width:34px;border-radius:10px;background:var(--line);transition:.25s}.bars .on b{background:var(--g)}.bars small{font-size:11px;color:var(--mut)}.bars em{font-style:normal;font-size:11px;font-weight:700}
.avg{position:absolute;inset-inline:0;border-top:2px dashed var(--b);opacity:.6;z-index:0}
h2{font-size:17px;font-weight:800;margin:0 0 6px}.mut{color:var(--mut);font-size:13px}.pos{color:var(--g)}.neg{color:var(--r)}
details.ct{border-top:1px solid var(--line)}details.ct:first-of-type{border:0}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer}summary::-webkit-details-marker{display:none}
.ci{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px}.cn{flex:1;display:flex;flex-direction:column}.cn small{color:var(--mut);font-size:12px}
.ca{text-align:end;font-variant-numeric:tabular-nums}.ca b{display:block}.ca small{font-size:12px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:-2px 0 8px}.bar i{display:block;height:100%;border-radius:3px}
.it{display:flex;justify-content:space-between;padding:5px 56px 5px 0;font-size:14px;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}.row.s{font-size:14px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 4px;gap:2px;direction:ltr}.stack i{display:block;height:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.grid b{display:block;font-size:22px;font-weight:800}
.cp{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:14px;margin:10px 0}
.cp .am{flex:none;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:800}.cp>div:nth-child(2){flex:1}
button.pr{border:0;border-radius:12px;padding:9px 14px;background:var(--ink);color:var(--card);font:inherit;font-weight:500;cursor:pointer}button.pr.ok{background:var(--g);color:#fff}
nav{position:fixed;inset-inline:14px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:532px;margin:0 auto;display:flex;background:var(--card);border-radius:26px;padding:6px;box-shadow:0 12px 36px -12px #0b122066}
nav button{flex:1;border:0;background:none;border-radius:20px;padding:8px 0;font:inherit;font-size:12px;color:var(--mut);cursor:pointer;transition:.2s}nav button span{display:block;font-size:20px}nav button.on{background:var(--gs);color:var(--g);font-weight:700}
#msg{text-align:center;padding:80px 10px}#msg h1{font-size:34px;margin:0 0 6px}.go{border:0;border-radius:16px;padding:14px 28px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
</style></head><body>
<main id="app"><div id="msg"><h1>הכסף שלי</h1><p class="mut">הנתונים נקראים ישירות מהדרייב שלך ולא נשמרים בשום מקום אחר.</p><button class="go" data-sync>התחברות עם Google</button></div></main>
<nav hidden><button data-t="home" class="on"><span>🏠</span>בית</button><button data-t="inv"><span>📈</span>השקעות</button><button data-t="ins"><span>🛡️</span>ביטוחים</button><button data-t="cp"><span>🎟️</span>קופונים</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
const CLIENT_ID='579770283485-41n96q8bol22fh83dkgua1lb5fq4n70c.apps.googleusercontent.com',SC='https://www.googleapis.com/auth/drive.readonly';
const FILES={exp:'סך הוצאת משק בית',inv:'תיק השקעות',ins:'לוח תשלומים ביטוח חיים'};
const COL=['#4f6bed','#12b76a','#f79009','#ee46bc','#06aed4','#84cc16','#f04438','#9e77ed'];
const ICO=[[/דיור|שכר|משכנת/,'🏠'],[/סופר|מזון|אוכל|מכולת/,'🛒'],[/מסעד|קפה|משלוח/,'🍽️'],[/רכב|דלק|תחבור|חני/,'🚗'],[/בריאות|רפוא|תרופ/,'💊'],[/טיפוח|ספא|שיער/,'💅'],[/בילוי|פנאי|חופש|טיול/,'🎬'],[/ביגוד|בגד|הנעל/,'👕'],[/חשמל|מים|ארנונה|גז/,'💡'],[/תקשור|סלולר|אינטרנט|טלפון/,'📱'],[/לימוד|חינוך|קורס/,'🎓'],[/מתנ|שונות/,'🎁']];
const ico=c=>(ICO.find(x=>x[0].test(c))||[0,'🏷️'])[1];
const S={exp:[],mon:[],inv:[],cp:[],ins:null,ym:0,tab:'home',hide:false};let token,tcl;
const $=s=>document.querySelector(s),ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const fmt=n=>S.hide?'₪•••':(n<0?'-':'')+'₪'+Math.round(Math.abs(n)).toLocaleString('he-IL'),pct=n=>(n>0?'+':'')+n.toFixed(1)+'%';
const fix=d=>new Date(d.getTime()+432e5),ymOf=d=>{d=fix(d);return d.getFullYear()*100+d.getMonth()+1};
const ymLb=y=>new Date(Math.floor(y/100),y%100-1,1).toLocaleDateString('he-IL',{month:'long',year:'numeric'});
const T=(a,k)=>a.reduce((s,r)=>s+(+r[k]||0),0),dl=d=>d.toLocaleDateString('he-IL');
function msg(t){$('#app').innerHTML='<div id="msg"><p>'+t+'</p></div>'}
function tc(){return tcl=tcl||google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SC,
  callback:r=>{if(r.access_token){token=r.access_token;ls('tok',JSON.stringify({t:token,e:Date.now()+(r.expires_in-120)*1e3}));ls('gd','1');load()}},error_callback:()=>{}})}
function login(silent){if(!window.google)return;tc().requestAccessToken({prompt:silent&&ls('gd')?'':ls('gd')?'':'consent'})}
async function getFile(name){
  const h={Authorization:'Bearer '+token},q=encodeURIComponent("name contains '"+name+"' and trashed=false and mimeType!='application/vnd.google-apps.folder'");
  const l=await(await fetch('https://www.googleapis.com/drive/v3/files?fields=files(id,name)&orderBy='+encodeURIComponent('modifiedTime desc')+'&q='+q,{headers:h})).json();
  if(l.error&&l.error.code==401){token=null;ls('tok',null);throw new Error('החיבור פג, לחץ על סנכרן')}
  if(!l.files||!l.files.length)throw new Error('לא נמצא בדרייב קובץ ששמו כולל: '+name);
  return XLSX.read(await(await fetch('https://www.googleapis.com/drive/v3/files/'+l.files[0].id+'?alt=media',{headers:h})).arrayBuffer(),{type:'array',cellDates:true});
}
async function load(){
  if(!S.exp.length)msg('טוען נתונים מהדרייב...');
  try{
    const wb=await getFile(FILES.exp),rows=XLSX.utils.sheet_to_json(wb.Sheets['ראשי'],{header:1,raw:true});
    S.exp=[];S.mon=[];S.cp=[];S.err='';
    rows.slice(1).forEach(x=>{
      if(typeof x[1]==='number'&&x[2]&&x[4] instanceof Date)S.exp.push({t:x[0],a:x[1],c:x[2],ym:ymOf(x[4])});
      if(x[9] instanceof Date&&typeof x[11]==='number')S.mon.push({ym:ymOf(x[9]),inc:+x[13]||0});
      if(x[21]&&typeof x[22]==='number'&&!String(x[21]).startsWith('סה'))S.cp.push({n:x[21],a:x[22],c:String(x[23]||'')});
    });
    if(!S.ym||!S.exp.some(e=>e.ym==S.ym))S.ym=Math.max(...S.exp.map(e=>e.ym));
    try{const w=await getFile(FILES.inv);S.inv=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]]).filter(r=>+r['שווי ₪']>0)}catch(e){S.invErr=e.message}
    try{S.ins=parseIns(await getFile(FILES.ins))}catch(e){S.ins=null;S.insErr=e.message}
    ls('data',JSON.stringify({exp:S.exp,mon:S.mon,inv:S.inv,ym:S.ym}));
    $('nav').hidden=false;draw();
  }catch(e){S.err=e.message;if(S.exp.length)draw();else msg('שגיאה: '+e.message+'<br><br><button class="go" data-sync>נסה שוב</button>')}
}
function parseIns(wb){
  const sm=wb.Sheets['סיכום'],pr=XLSX.utils.sheet_to_json(wb.Sheets['פרמיות שנתיות'],{header:1,raw:true}).slice(4,36),st=fix(sm.C6.v),yrs=+sm.C7.v,pay=[];
  for(let n=0;n<yrs*12;n++){const y=Math.floor(n/12),r=pr[y]||[],t=(+r[6]||0)+(+r[7]||0);pay.push({d:new Date(st.getFullYear(),st.getMonth()+n,st.getDate()),a:t?Math.floor(t/12*100)/100:null})}
  return{yrs,pay,pr,end:new Date(st.getFullYear(),st.getMonth()+yrs*12,st.getDate())};
}
function home(){
  const ys=[...new Set(S.exp.map(e=>e.ym))].sort((a,b)=>a-b),i=ys.indexOf(S.ym),sy=y=>T(S.exp.filter(e=>e.ym==y),'a'),
  m=S.exp.filter(e=>e.ym==S.ym),tot=sy(S.ym),pm=ys.slice(Math.max(0,i-6),i),avg=pm.length?T(S.exp.filter(e=>pm.includes(e.ym)),'a')/pm.length:0,
  inc=(S.mon.find(x=>x.ym==S.ym)||{}).inc||0,diff=tot-avg,cat={};
  m.forEach(e=>(cat[e.c]=cat[e.c]||[]).push(e));
  const cs=Object.entries(cat).map(([c,a])=>[c,T(a,'a'),a]).sort((x,y)=>y[1]-x[1]),
  cav=c=>pm.length?T(S.exp.filter(e=>pm.includes(e.ym)&&e.c==c),'a')/pm.length:0,
  last=ys.slice(Math.max(0,i-5),i+1),sums=last.map(sy),mx=Math.max(...sums,avg,1),
  now=new Date(),days=Math.floor(S.ym/100)==now.getFullYear()&&S.ym%100==now.getMonth()+1?now.getDate():new Date(Math.floor(S.ym/100),S.ym%100,0).getDate(),
  big=m.reduce((a,e)=>e.a>(a.a||0)?e:a,{});
  return `<div class="mp"><button data-m="1" ${i>=ys.length-1?'disabled':''}>←</button><strong>${ymLb(S.ym)}</strong><button data-m="-1" ${i<=0?'disabled':''}>→</button></div>
  <div class="card"><div class="lb">הוצאות החודש</div><div class="big">${fmt(tot)}</div>
  ${avg?`<span class="chip ${diff>0?'bad':''}">${diff>0?'↑':'↓'} ${fmt(Math.abs(diff))} ${diff>0?'יותר':'פחות'} מהממוצע</span>`:''}
  ${inc?`<div class="row s" style="margin-top:12px"><span class="lb">משכורת ${fmt(inc)}</span><b class="${inc-tot<0?'neg':'pos'}">נשאר ${fmt(inc-tot)}</b></div>`:''}
  <div class="trio"><div><span class="lb">ממוצע ליום</span><b>${fmt(tot/days)}</b></div><div><span class="lb">פעולות</span><b>${m.length}</b></div><div><span class="lb">הכי גדולה</span><b>${fmt(big.a||0)}</b></div></div></div>
  <div class="card"><h2>חצי שנה אחרונה</h2><span class="lb">הקו המקווקו הוא הממוצע ${fmt(avg)}</span><div class="bars">${avg?`<div class="avg" style="bottom:calc(${avg/mx*78}% + 19px)"></div>`:''}
  ${last.map((y,k)=>`<div data-y="${y}" class="${y==S.ym?'on':''}">${y==S.ym?`<em>${fmt(sums[k])}</em>`:''}<b style="height:${Math.max(sums[k]/mx*78,3)}%"></b><small>${new Date(Math.floor(y/100),y%100-1,1).toLocaleDateString('he-IL',{month:'short'})}</small></div>`).join('')}</div></div>
  <div class="card"><h2>קטגוריות מובילות</h2><span class="lb">לחץ על קטגוריה לפירוט, והחץ משווה לממוצע שלה</span>${cs.map(([c,v,a],k)=>{const av=cav(c),r=av?v/av:0;
  return `<details class="ct"><summary><span class="ci" style="background:${COL[k%8]}22">${ico(c)}</span><span class="cn"><b>${c}</b><small>${Math.round(v/tot*100)}% מההוצאות</small></span>
  <span class="ca"><b>${fmt(v)}</b>${av?`<small class="${r>1.1?'neg':r<.9?'pos':'mut'}">${r>1.1?'▲':r<.9?'▼':'≈'} ממוצע ${fmt(av)}</small>`:''}</span></summary>
  <div class="bar"><i style="width:${v/cs[0][1]*100}%;background:${COL[k%8]}"></i></div>${a.sort((x,y)=>y.a-x.a).map(e=>`<div class="it"><span>${e.t}</span><span>${fmt(e.a)}</span></div>`).join('')}</details>`}).join('')||'<p class="mut">אין הוצאות בחודש הזה.</p>'}</div>`;
}
function inv(){
  if(!S.inv.length)return `<div class="card"><p>${S.invErr||'לא נמצאו נתוני השקעות.'}</p></div>`;
  const val=T(S.inv,'שווי ₪'),cost=T(S.inv,'עלות ₪'),gain=val-cost,tax=Math.max(0,gain)*.25,acc={},top=[...S.inv].sort((a,b)=>b['שווי ₪']-a['שווי ₪']);
  S.inv.forEach(r=>(acc[r['חשבון']]=acc[r['חשבון']]||[]).push(r));
  return `<div class="card"><div class="lb">סך השקעות</div><div class="big">${fmt(val)}</div><span class="chip ${gain<0?'bad':''}">${pct(gain/cost*100)} · ${fmt(gain)} רווח</span>
  <div class="stack">${top.slice(0,6).map((r,k)=>`<i style="width:${r['שווי ₪']/val*100}%;background:${COL[k]}"></i>`).join('')}</div>
  <div class="trio"><div><span class="lb">מס משוער</span><b>${fmt(-tax)}</b></div><div><span class="lb">אחרי מס</span><b>${fmt(val-tax)}</b></div></div>
  <p class="mut" style="margin:10px 0 0">הערכה בלבד: מס 25% על הרווח הכולל, בלי הצמדה למדד ובלי עמלות.</p></div>`+
  Object.entries(acc).map(([n,a],k)=>{const v=T(a,'שווי ₪'),c=T(a,'עלות ₪');
  return `<div class="card"><div class="row"><h2 style="margin:0">${n}</h2><b>${fmt(v)}</b></div><div class="row s"><span class="mut">תשואה</span><b class="${v<c?'neg':'pos'}">${pct((v-c)/c*100)}</b></div>
  ${a.sort((x,y)=>y['שווי ₪']-x['שווי ₪']).map(r=>{const g=r['שווי ₪']-r['עלות ₪'],sh=r['שווי ₪']/v*100;return `<div style="padding-top:12px"><div class="row" style="padding:0"><span>${r['שם']}</span><b>${fmt(r['שווי ₪'])}</b></div>
  <div class="row s mut" style="padding:0"><span>${sh.toFixed(0)}% מהחשבון</span><span class="${g<0?'neg':'pos'}">${fmt(g)}</span></div><div class="bar" style="margin:4px 0 0"><i style="width:${sh}%;background:${COL[k*3%8]}"></i></div></div>`}).join('')}</div>`}).join('');
}
function ins(){
  const I=S.ins;if(!I)return `<div class="card"><p>${S.insErr||'הנתון זמין אחרי סנכרון עם הדרייב.'}</p></div>`;
  const now=new Date(),pd=I.pay.filter(p=>p.d<=now),paid=T(pd,'a'),nx=I.pay.find(p=>p.d>now),pc=pd.length/I.pay.length*100,yi=Math.min(Math.floor(pd.length/12),I.yrs-1),r=I.pr[yi]||[],miss=I.pay.filter(p=>p.a===null).length;
  return `<div class="card"><div class="lb">ביטוח חיים · שולם עד היום</div><div class="big">${fmt(paid)}</div><span class="chip">${pd.length} מתוך ${I.pay.length} תשלומים</span>
  <div class="bar" style="height:10px;margin:16px 0 6px"><i style="width:${Math.max(pc,1)}%;background:var(--g)"></i></div><div class="lb">${pc.toFixed(1)}% מתקופת הביטוח · מסתיים ב-${dl(I.end)}</div></div>
  <div class="grid"><div class="card"><span class="lb">התשלום הבא</span><b>${nx&&nx.a?fmt(nx.a):'—'}</b><span class="lb">${nx?dl(nx.d):''}</span></div><div class="card"><span class="lb">סכום ביטוח כיום</span><b>${fmt(r[5]||0)}</b><span class="lb">לכל מבוטח</span></div></div>
  ${miss?`<p class="mut" style="margin:10px 4px">ל-${miss} תשלומים עתידיים עדיין אין פרמיה בפוליסה.</p>`:''}
  <div class="card"><h2>פרמיה חודשית לפי שנת ביטוח</h2>${I.pr.filter(x=>x[0]).map(x=>{const m=((+x[6]||0)+(+x[7]||0))/12,cur=x[0]==yi+1;return `<div class="row s" style="${cur?'font-weight:700':'color:var(--mut)'}"><span>שנה ${x[0]}${cur?' (נוכחית)':''}</span><span>${m?fmt(m):'טרם פורסם'}</span></div>`}).join('')}</div>`;
}
function cp(){
  if(!S.cp.length)return `<div class="card"><p>${S.exp.length?'לא נמצאו קופונים בקובץ ההוצאות.':''}הקופונים זמינים אחרי סנכרון עם הדרייב.</p></div>`;
  return `<div class="card"><div class="lb">שווי קופונים</div><div class="big">${fmt(T(S.cp,'a'))}</div><span class="chip">${S.cp.length} קופונים</span></div>`+
  S.cp.map((c,k)=>`<div class="cp"><div class="am" style="background:${COL[k%8]}">${fmt(c.a)}</div><div><b>${c.n}</b><div class="mut">${c.c.startsWith('http')?'קישור למימוש':'קוד'}</div></div><button class="pr" data-c="${k}">${c.c.startsWith('http')?'פתח':'העתק קוד'}</button></div>`).join('');
}
function draw(){
  $('#app').innerHTML=`<header><b>הכסף שלי</b><div><button data-eye title="הסתר סכומים">${S.hide?'🙈':'👁'}</button><button data-sync title="סנכרון">⟳</button></div></header>`+
  (token?'':`<div class="bn"><span>${S.err||'מציג נתונים מהסנכרון האחרון'}</span><button data-sync>סנכרן</button></div>`)+`<div class="view">${{home,inv,ins,cp}[S.tab]()}</div>`;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-y]');
  if(!b){if(!token&&ls('gd'))login(true);return}
  if('sync'in b.dataset)login();
  if('eye'in b.dataset){S.hide=!S.hide;ls('hide',S.hide?'1':'0');draw()}
  if(b.dataset.t){S.tab=b.dataset.t;draw();scrollTo(0,0)}
  if(b.dataset.y){S.ym=+b.dataset.y;draw()}
  if(b.dataset.m){const y=[...new Set(S.exp.map(e=>e.ym))].sort((a,b)=>a-b);S.ym=y[y.indexOf(S.ym)+ +b.dataset.m];draw()}
  if(b.dataset.c){const c=S.cp[+b.dataset.c];if(c.c.startsWith('http'))open(c.c,'_blank','noopener');else{navigator.clipboard.writeText(c.c);b.textContent='הועתק ✓';b.classList.add('ok')}}
});
(function boot(){
  S.hide=ls('hide')=='1';
  try{const d=JSON.parse(ls('data'));if(d&&d.exp&&d.exp.length){Object.assign(S,d);$('nav').hidden=false;draw()}}catch(e){}
  try{const t=JSON.parse(ls('tok'));if(t&&t.e>Date.now()){token=t.t;load()}}catch(e){}
  const w=setInterval(()=>{if(window.google){clearInterval(w);if(!token&&ls('gd'))login(true)}},300);
  setInterval(()=>{if(document.visibilityState=='visible'&&window.google&&ls('gd'))login(true)},45*60*1e3);
})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
