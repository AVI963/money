<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#070b12" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>הכסף שלי</title>
<style>
:root{
  --bg:#f2f5fb;--card:#ffffff;--card2:#f6f8fd;--ink:#0b1220;--mut:#64748b;--line:#e6ebf4;
  --brd:#e6ebf4;--txt:#0b1220;--acc:#1a73e8;--ok:#16a34a;--bad:#dc2626;
  --g:#10b981;--g2:#059669;--gs:#e2f8f0;--r:#ef4444;--rs:#feeceb;--w:#f59e0b;--ws:#fef3c7;--b:#4f6bed;--bs:#eef2ff;
  --bd:rgba(15,23,42,.065);--in-hi:rgba(255,255,255,.92);
  --sh:0 12px 32px -14px rgba(15,23,42,.12),0 2px 6px -1px rgba(15,23,42,.04);
  --sh-lg:0 22px 46px -16px rgba(15,23,42,.16),0 4px 14px -2px rgba(15,23,42,.05);
  --glass:rgba(255,255,255,.88);--glass-bd:rgba(255,255,255,.78);
  --nav-sh:0 18px 42px -10px rgba(15,23,42,.2),0 2px 10px -2px rgba(15,23,42,.06)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#070b12;--card:#0f1622;--card2:#151f2e;--ink:#f1f5f9;--mut:#8b9bb0;--line:#1c2738;
  --brd:#1c2738;--txt:#f1f5f9;--acc:#60a5fa;--ok:#34d399;--bad:#f87171;
  --g:#10b981;--g2:#34d399;--gs:rgba(16,185,129,.16);--r:#f87171;--rs:rgba(239,68,68,.16);--w:#fbbf24;--ws:rgba(245,158,11,.16);--b:#6366f1;--bs:rgba(99,102,241,.16);
  --bd:rgba(255,255,255,.075);--in-hi:rgba(255,255,255,.055);
  --sh:0 14px 36px -14px rgba(0,0,0,.65),0 2px 8px -2px rgba(0,0,0,.35);
  --sh-lg:0 22px 48px -16px rgba(0,0,0,.78);
  --glass:rgba(15,22,34,.88);--glass-bd:rgba(255,255,255,.1);
  --nav-sh:0 20px 46px -10px rgba(0,0,0,.78)
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 Heebo,system-ui,-apple-system,Arial,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(108px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden
}
body::before{
  content:"";position:fixed;inset:0 0 auto 0;height:300px;pointer-events:none;z-index:-1;
  background:radial-gradient(85% 90% at 15% 0%,rgba(16,185,129,.11),transparent 65%),
             radial-gradient(75% 80% at 88% 4%,rgba(79,107,237,.10),transparent 62%)
}
main{max-width:560px;margin:0 auto;padding:8px 16px}
button,summary,.mp-bar,.mp-pill,.cf-col,.bars>div,.mtile,.donut-wrap,.lg-row,.dots i{user-select:none;-webkit-user-select:none}
button{transition:transform .18s cubic-bezier(.22,1,.36,1),background-color .22s,opacity .2s,box-shadow .22s,border-color .22s,color .2s}
button:active:not(:disabled){transform:scale(.95)}

/* Header */
header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 10px;gap:12px}
.hdr-title{display:flex;flex-direction:column;gap:2px}
header b{font-size:22px;font-weight:800;letter-spacing:-.35px;line-height:1.15}
.hdr-meta{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut)}
.sync-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.sync-pill i{width:6px;height:6px;border-radius:50%;background:var(--g);display:inline-block}
.sync-pill.busy i{background:var(--w);animation:pulse 1s infinite}
.sync-pill.off i{background:var(--mut)}
@keyframes pulse{50%{opacity:.3}}
header .hdr-acts{display:flex;align-items:center;gap:8px}
header button{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 var(--in-hi),var(--sh);color:var(--ink);padding:0}
header button:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 var(--in-hi),var(--sh-lg)}
header button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header button.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* View & Staggered Card Animations */
.view{animation:in .28s cubic-bezier(.22,1,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.view > .card,.view > .grid,.view > .mgrid{animation:cardUp .38s cubic-bezier(.22,1,.36,1) both}
.view > :nth-child(2){animation-delay:.03s}
.view > :nth-child(3){animation-delay:.06s}
.view > :nth-child(4){animation-delay:.09s}
.view > :nth-child(5){animation-delay:.12s}
.view > :nth-child(6){animation-delay:.15s}
.view.no-anim,.view.no-anim > *,.view.no-anim .bar i,.view.no-anim .cf-bar{animation:none!important;transition:none!important}
@keyframes cardUp{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.view,.view>*,.bar i,.pace-fill,.cf-bar,.bars b,header button.spin svg,.sync-pill.busy i{animation:none!important;transition:none!important}}

/* Banner */
.bn{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 14px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;box-shadow:inset 0 1px 0 var(--in-hi),var(--sh)}
.bn button{border:0;background:var(--g);color:#fff;border-radius:11px;padding:6px 14px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}

/* Elevated Premium Cards */
.card{
  background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:19px;margin:12px 0;
  box-shadow:inset 0 1px 0 var(--in-hi),var(--sh)
}
.hg{
  position:relative;overflow:hidden;
  background:
    radial-gradient(120% 95% at 0% 0%,rgba(16,185,129,.17) 0%,rgba(79,107,237,.11) 48%,transparent 100%),
    var(--card);
  box-shadow:inset 0 1px 0 var(--in-hi),var(--sh-lg);
  transition:background .35s ease
}
.hg.warn{background:radial-gradient(120% 95% at 0% 0%,rgba(245,158,11,.19) 0%,rgba(16,185,129,.08) 52%,transparent 100%),var(--card)}
.hg.bad{background:radial-gradient(120% 95% at 0% 0%,rgba(239,68,68,.19) 0%,rgba(245,158,11,.09) 52%,transparent 100%),var(--card)}

/* Smart Status Pill */
.dpill{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--card);border:1px solid var(--bd);border-radius:99px;
  padding:8px 14px;margin:2px 0 12px;font-size:12.5px;font-weight:700;
  box-shadow:inset 0 1px 0 var(--in-hi),var(--sh)
}
.dpill .dp-main{display:flex;align-items:center;gap:8px;min-width:0}
.dpill .dp-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3.5px var(--gs)}
.dpill.warn .dp-dot{background:var(--w);box-shadow:0 0 0 3.5px var(--ws)}
.dpill.bad .dp-dot{background:var(--r);box-shadow:0 0 0 3.5px var(--rs)}
.dpill .dp-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpill .dp-sub{flex:none;font-size:11.5px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}

/* Run-Rate Forecast Sub-panel inside Hero */
.rr-box{
  margin-top:14px;padding:12px 15px;border-radius:18px;
  background:var(--card2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.rr-l{display:flex;flex-direction:column;gap:1px;min-width:0}
.rr-l .rr-lbl{font-size:12px;font-weight:600;color:var(--mut)}
.rr-l .rr-val{font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.15}
.rr-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}

/* Monthly Variable Pace Bar + Today Marker */
.pace-box{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.pace-hdr{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:26px;font-variant-numeric:tabular-nums}
.pace-track{position:relative;height:10px;border-radius:99px;background:var(--line);overflow:visible}
.pace-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g2),var(--g));transform-origin:right center;animation:growX .55s cubic-bezier(.22,1,.36,1);transition:width .4s cubic-bezier(.22,1,.36,1),background .3s}
.pace-fill.warn{background:linear-gradient(90deg,#d97706,var(--w))}
.pace-fill.bad{background:linear-gradient(90deg,#dc2626,var(--r))}
.pace-now{position:absolute;top:-4px;bottom:-4px;width:2.5px;background:var(--ink);border-radius:2px;z-index:2;transform:translateX(50%)}
.pace-now-lbl{position:absolute;top:-20px;transform:translateX(50%);font-size:10px;font-weight:700;color:var(--ink);white-space:nowrap;background:var(--card);padding:0 6px;border-radius:6px;border:1px solid var(--bd);box-shadow:0 2px 5px rgba(0,0,0,.07)}
.pace-ft{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:7px;font-variant-numeric:tabular-nums}

/* Quiet Trends Sparklines */
.tr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tr-row:first-of-type{border-top:0;padding-top:4px}
.tr-info{flex:1;min-width:0}
.tr-info b{display:block;font-size:13.5px}
.tr-info small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-spk{flex:none;width:74px;height:28px}

/* Modern Scrollable Month Strip + Quick Calendar Button */
.mp-bar{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.mp-strip{
  flex:1;display:flex;align-items:center;gap:6px;overflow-x:auto;
  scrollbar-width:none;scroll-snap-type:x proximity;padding:3px 2px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)
}
.mp-strip::-webkit-scrollbar{display:none}
.mp-pill{
  flex:none;scroll-snap-align:center;border:1px solid var(--bd);background:var(--card);color:var(--mut);
  border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  box-shadow:inset 0 1px 0 var(--in-hi),0 2px 8px -3px rgba(15,23,42,.08)
}
.mp-pill.on{
  background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:800;
  padding:7px 17px;box-shadow:0 8px 20px -6px rgba(15,23,42,.32)
}
.mp-cal{
  flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);
  box-shadow:inset 0 1px 0 var(--in-hi),var(--sh);padding:0
}
.mp-cal svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Month Picker Bottom Sheet */
.ms-back{
  position:fixed;inset:0;background:rgba(7,11,18,.48);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease
}
@keyframes fadeIn{from{opacity:0}}
.ms-sheet{
  width:100%;max-width:560px;max-height:78vh;overflow-y:auto;background:var(--card);
  border-top-left-radius:28px;border-top-right-radius:28px;border:1px solid var(--bd);
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 48px rgba(0,0,0,.25);
  animation:sheetUp .26s cubic-bezier(.22,1,.36,1)
}
@keyframes sheetUp{from{transform:translateY(100%)}}
.ms-grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.ms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.ms-cell{
  border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:16px;
  padding:10px 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px
}
.ms-cell.on{background:var(--gs);border-color:var(--g);color:var(--g2)}
@media(prefers-color-scheme:dark){.ms-cell.on{color:var(--g)}}
.ms-cell b{font-size:14px;font-weight:800}
.ms-cell small{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.ms-cell.on small{color:inherit;font-weight:700}

/* Typography & Badges */
.lb{color:var(--mut);font-size:13px;font-weight:500}
.big{font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1.1;font-variant-numeric:tabular-nums;margin:3px 0}
.chips-inline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700;background:var(--gs);color:var(--g);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.chip.warn{background:var(--ws);color:#b45309}@media(prefers-color-scheme:dark){.chip.warn{color:var(--w)}}
.chip.bad{background:var(--rs);color:var(--r)}
.chip.mut{background:var(--card2);color:var(--mut);border:1px solid var(--bd);font-weight:600}
.trio{display:flex;border-top:1px solid var(--line);margin-top:15px;padding-top:13px}
.trio div{flex:1;text-align:center}
.trio b{display:block;font-size:16.5px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.trio div+div{border-inline-start:1px solid var(--line)}

/* Redesigned Income vs Expense Cashflow Chart */
.cf-grid{display:flex;gap:6px;height:152px;direction:rtl;margin-top:12px;align-items:stretch}
.cf-col{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:5px;padding:6px 3px 5px;border-radius:14px;cursor:pointer;
  transition:background .2s,transform .18s
}
.cf-col:hover{background:var(--card2)}
.cf-col.on{background:var(--card2);box-shadow:inset 0 0 0 1px var(--bd)}
.cf-net{font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px;line-height:1;height:13px}
.cf-bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;min-height:0}
.cf-bar{
  width:13px;border-radius:7px 7px 4px 4px;transform-origin:bottom center;
  animation:growY .5s cubic-bezier(.22,1,.36,1) both;transition:height .35s cubic-bezier(.22,1,.36,1)
}
.cf-bar.inc{background:linear-gradient(180deg,#34d399,#10b981);box-shadow:0 4px 10px -4px rgba(16,185,129,.45)}
.cf-bar.exp{background:linear-gradient(180deg,#fb7185,#ef4444);box-shadow:0 4px 10px -4px rgba(239,68,68,.4)}
.cf-bar.ghost{background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.cf-col small{font-size:11px;color:var(--mut);font-weight:600}
.cf-col.on small{color:var(--g);font-weight:800}

/* Legacy Bars (Mortgage actual charges) */
.bars{display:flex;gap:8px;height:130px;direction:rtl;position:relative;margin-top:10px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;gap:5px;height:100%;position:relative;z-index:1}
.bars b{width:100%;max-width:34px;border-radius:10px;background:var(--line);transform-origin:bottom center;animation:growY .5s cubic-bezier(.22,1,.36,1) both;transition:.25s}.bars .on b{background:var(--g)}.bars small{font-size:11px;color:var(--mut)}

/* Interactive SVG Area Chart */
.svgc{position:relative;margin-top:12px;user-select:none;-webkit-user-select:none;touch-action:auto}
.svgc svg{width:100%;height:146px;display:block;overflow:visible;cursor:crosshair}
.svgc .scrub-tip{position:absolute;top:-8px;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;white-space:nowrap;pointer-events:none;box-shadow:0 8px 20px -4px rgba(0,0,0,.35);opacity:0;transition:opacity .15s;font-variant-numeric:tabular-nums;z-index:3}
.svgc .scrub-tip.on{opacity:1}
.svgc .xlabs{display:flex;justify-content:space-between;direction:ltr;padding:5px 6px 0;font-size:11px;color:var(--mut)}
.svgc .xlabs span{text-align:center;min-width:28px;transition:color .15s,font-weight .15s}
.svgc .xlabs span.on{color:var(--g);font-weight:700}

/* Headings & Rows */
h2{font-size:17px;font-weight:800;margin:0 0 6px;letter-spacing:-.25px}
.mut{color:var(--mut);font-size:13px}.pos{color:var(--g)}.neg{color:var(--r)}

/* Smooth Category Accordion & Outlier Toggle */
details.ct{border-top:1px solid var(--line)}details.ct:first-of-type{border:0}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;transition:opacity .18s}summary::-webkit-details-marker{display:none}
.ci{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:21px;transition:transform .2s cubic-bezier(.22,1,.36,1)}
details.ct[open] .ci{transform:scale(1.06)}
.cn{flex:1;display:flex;flex-direction:column;min-width:0}.cn small{color:var(--mut);font-size:12px}
.ca{text-align:end;font-variant-numeric:tabular-nums}.ca b{display:block;font-size:15.5px}.ca small{font-size:11.5px;font-weight:700}
.chev{width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .24s cubic-bezier(.22,1,.36,1);flex:none}
details.ct[open] .chev{transform:rotate(180deg)}
.ct-body{overflow:hidden}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:-2px 0 8px}.bar i{display:block;height:100%;border-radius:99px;transform-origin:right center;animation:growX .5s cubic-bezier(.22,1,.36,1) both;transition:width .35s cubic-bezier(.22,1,.36,1)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 56px 8px 2px;font-size:13.5px;color:var(--mut);border-top:1px dashed var(--line);transition:opacity .2s}
.it:first-of-type{border-top:0}
.it.ex-off{opacity:.58}
.it.ex-off .it-name{text-decoration:line-through}
.it-day{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums;margin-inline-end:5px}
.it-r{display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap}
.ex-btn{
  border:1px solid var(--line);background:var(--card2);color:var(--mut);
  border-radius:99px;padding:3px 9px;font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;
  white-space:nowrap;flex:none
}
.ex-btn.on{background:var(--ws);border-color:rgba(245,158,11,.35);color:#b45309}
@media(prefers-color-scheme:dark){.ex-btn.on{color:var(--w)}}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}.row.s{font-size:14px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:14px 0 6px;gap:2px;direction:ltr}.stack i{display:block;height:100%;transition:width .4s cubic-bezier(.22,1,.36,1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.grid b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}

/* Coupons & Docs & Menu */
.cp{
  position:relative;display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--bd);border-radius:22px;
  padding:14px;margin:10px 0;box-shadow:inset 0 1px 0 var(--in-hi),var(--sh)
}
.cp .am{flex:none;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:0 8px 18px -6px rgba(0,0,0,.25)}
.cp>div:nth-child(2){flex:1;min-width:0}
button.pr{border:0;border-radius:13px;padding:9px 14px;background:var(--ink);color:var(--card);font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none}
button.pr.ok{background:var(--g);color:#fff}

/* Customizable More Grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0}
.mtile{

async function driveFetchWithRetry(url,opts={},retried=false){
  if(!token&&ls('rt'))await refresh();
  if(!token){
    const err=new Error('החיבור פג, לחץ על סנכרן');
    err.code=401;
    throw err;
  }
  const headers={...(opts.headers||{}),Authorization:'Bearer '+token};
  const res=await fetch(url,{...opts,headers});
  if(res.status===401&&!retried){
    token=null;ls('tok',null);
    if(await refresh())return driveFetchWithRetry(url,opts,true);
    const err=new Error('החיבור פג, לחץ על סנכרן');
    err.code=401;
    throw err;
  }
  if(res.status===403){
    const err=new Error('חסרה הרשאת גישה מלאה ל-Google Drive (403) — לחץ על סנכרן לאישור מחדש');
    err.code=403;
    err.needScope=true;
    throw err;
  }
  return res;
}

async function getFile(name){
  const q=encodeURIComponent((name[0]=='='?"name = '"+name.slice(1)+"'":"name contains '"+name+"'")+" and trashed=false and mimeType!='application/vnd.google-apps.folder'");
  const listRes=await driveFetchWithRetry('https://www.googleapis.com/drive/v3/files?fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true&orderBy='+encodeURIComponent('modifiedTime desc')+'&q='+q);
  const l=await listRes.json();
  if(l.error){
    const e=new Error(l.error.message||'שגיאת Google Drive');
    e.code=l.error.code;
    throw e;
  }
  if(!l.files||!l.files.length)throw new Error('לא נמצא בדרייב קובץ ששמו כולל: '+name);
  const mediaRes=await driveFetchWithRetry('https://www.googleapis.com/drive/v3/files/'+l.files[0].id+'?alt=media&supportsAllDrives=true');
  if(!mediaRes.ok)throw new Error('שגיאה בהורדת הקובץ מהדרייב ('+mediaRes.status+')');
  return XLSX.read(await mediaRes.arrayBuffer(),{type:'array',cellDates:true});
}

function parseIns(wb){

function areaChart(pts,opts={}){

    ...p,k,
    x:+(pX+(n===1?pW/2:(1-k/(n-1))*pW)).toFixed(1),
    y:+(pT+pH-(p.v/maxV)*pH).toFixed(1)
  }));
  let line='M '+coords[0].x+' '+coords[0].y;
  for(let k=1;k<coords.length;k++){
    const a=coords[k-1],b=coords[k],cx=+((a.x+b.x)/2).toFixed(1);
    line+=` C ${cx} ${a.y}, ${cx} ${b.y}, ${b.x} ${b.y}`;
  }
  const area=n>1?`${line} L ${coords[n-1].x} ${pT+pH} L ${coords[0].x} ${pT+pH} Z`:'';
  const avgY=opts.avg?+(pT+pH-(opts.avg/maxV)*pH).toFixed(1):null;
  const midY=+(pT+pH*0.5).toFixed(1);
  const gid='ag'+Math.random().toString(36).slice(2,7);
  const payload=encodeURIComponent(JSON.stringify(coords.map(c=>({x:c.x,y:c.y,lb:c.lb,flb:c.flb||c.lb,v:c.v,ym:c.ym||0}))));
  return `<div class="svgc" data-scrb="${payload}">
    <div class="scrub-tip"></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--g)" stop-opacity=".36"/><stop offset="100%" stop-color="var(--g)" stop-opacity="0"/></linearGradient></defs>
      <line x1="${pX}" y1="${midY}" x2="${W-pX}" y2="${midY}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4" opacity=".8" vector-effect="non-scaling-stroke"/>
      ${avgY!==null?`<line x1="${pX}" y1="${avgY}" x2="${W-pX}" y2="${avgY}" stroke="var(--b)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7" vector-effect="non-scaling-stroke"/>`:''}
      ${area?`<path d="${area}" fill="url(#${gid})"/>`:''}
      ${n>1?`<path d="${line}" fill="none" stroke="var(--g)" stroke-width="2.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`:''}
      <line class="scrub-ln" x1="0" y1="${pT}" x2="0" y2="${pT+pH}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0" vector-effect="non-scaling-stroke"/>
      <line class="scrub-dot-ring" x1="0" y1="0" x2="0.001" y2="0" stroke="var(--card)" stroke-width="15" stroke-linecap="round" opacity="0" vector-effect="non-scaling-stroke"/>

      ${coords.map(c=>{const x2=+(c.x+0.001).toFixed(3);return `${c.on?`<line x1="${c.x}" y1="${c.y}" x2="${x2}" y2="${c.y}" stroke="var(--g)" stroke-width="20" stroke-linecap="round" opacity=".18" vector-effect="non-scaling-stroke"/>`:''}<line x1="${c.x}" y1="${c.y}" x2="${x2}" y2="${c.y}" stroke="var(--g)" stroke-width="${c.on?12:9.5}" stroke-linecap="round" vector-effect="non-scaling-stroke" ${c.ym?`data-y="${c.ym}"`:''} style="cursor:pointer"/><line x1="${c.x}" y1="${c.y}" x2="${x2}" y2="${c.y}" stroke="${c.on?'var(--g)':'var(--card)'}" stroke-width="${c.on?6.5:5.2}" stroke-linecap="round" vector-effect="non-scaling-stroke" ${c.ym?`data-y="${c.ym}"`:''} style="cursor:pointer"/>`}).join('')}
    </svg>
    ${opts.showLabels!==false?`<div class="xlabs">${[...coords].reverse().map(c=>`<span class="${c.on?'on':''}" ${c.ym?`data-y="${c.ym}"`:''} style="cursor:pointer">${esc(c.lb)}</span>`).join('')}</div>`:''}
  </div>`;
}

function sparkSvg(vals,col){
  if(!vals||vals.length<2)return '';
  const W=74,H=28,p=3.5,mx=Math.max(...vals,1),mn=Math.min(...vals,0),sp=Math.max(mx-mn,1);
  const pts=vals.map((v,i)=>{

    const y=H-p-((v-mn)/sp)*(H-p*2);
    return [x.toFixed(1),y.toFixed(1)];
  });
  const d='M '+pts.map(a=>a.join(' ')).join(' L ');
  const last=pts[pts.length-1];
  return `<svg class="tr-spk" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${col}"/></svg>`;

function todayISO(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addMonthsISO(isoDate,months){
  const mNum=Number(months)||0;
  if(!isoDate||mNum<=0)return '';
  const [y,m,d]=String(isoDate).split('-').map(Number);
  if(!y||!m||!d)return '';
  const tot=y*12+(m-1)+mNum;
  const ny=Math.floor(tot/12),nm=tot%12;
  const maxD=new Date(ny,nm+1,0).getDate();
  return `${ny}-${String(nm+1).padStart(2,'0')}-${String(Math.min(d,maxD)).padStart(2,'0')}`;
}
function parseLocalDate(val){
  if(!val)return null;
  if(val instanceof Date)return isNaN(+val)?null:val;
  if(typeof val==='number'&&val>20000&&val<100000){
    const d=new Date(Math.round((val-25569)*864e5)+432e5);
    return isNaN(+d)?null:d;
  }
  const s=String(val).trim();
  const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3],12,0,0);
  const dmy=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);
  if(dmy)return new Date(+dmy[3],+dmy[2]-1,+dmy[1],12,0,0);
  const d=new Date(s);
  return isNaN(+d)?null:d;
}
function normDocKey(s){
  return String(s||'').replace(/\(.*?\)/g,'').replace(/\s*-\s*\d{4}-\d{2}-\d{2}$/,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
}
function extractDriveId(url){
  const m=String(url||'').match(/\/d\/([a-zA-Z0-9_-]{10,})|[?&]id=([a-zA-Z0-9_-]{10,})/);
  return m?(m[1]||m[2]):'';
}

function warrantyPreviewHtml(purchaseDate,months){
  const m=Number(months)||0;

  if(!expD)return '<span class="mut">בחר תאריך רכישה לחישוב תוקף</span>';

  return `<span>תוקף עד: <b>${dl(expD)}</b> <small class="mut">(${m} חוד׳)</small></span><span class="chip ${cls}">${stTxt}</span>`;
}

/* Living Runway + 4% Rule / 300 Months & 300 Salaries Calculator */
function fireDefaults(){
  const now=new Date(),curYm=now.getFullYear()*100+now.getMonth()+1;
  const allYs=[...new Set(S.exp.map(e=>e.ym))].sort((a,b)=>a-b);
  const closedYs=allYs.filter(y=>y<curYm);
  const baseYs=closedYs.length>=2?closedYs.slice(-6):allYs.slice(-6);
  const avgExp=baseYs.length?Math.round(T(S.exp.filter(e=>baseYs.includes(e.ym)&&!isExcl(e)),'a')/baseYs.length):12000;
  const incYs=S.mon.filter(x=>x.inc>0).map(x=>x.ym).sort((a,b)=>a-b).slice(-6);
  const avgInc=incYs.length?Math.round(T(S.mon.filter(x=>incYs.includes(x.ym)),'inc')/incYs.length):avgExp;
  const estSave=Math.max(1000,Math.round((avgInc-avgExp)/500)*500||3000);
  return{
    exp:Math.max(3000,Math.round(avgExp/100)*100),
    baseExp:avgExp,
    baseInc:avgInc,
    swr:4,
    ret:6,
    save:estSave,
    incPen:false,
    taxAdj:false,
    runwayGoal:6
  };
}
function calcFire(F,def){
  const liquidVal=T(S.inv,'שווי ₪');
  const penVal=T(S.pen,'שווי ₪');
  const capital=liquidVal+(F.incPen?penVal:0);
  const effSwr=F.taxAdj?F.swr*0.85:F.swr;
  const mult=Math.round(1200/effSwr);
  const monthlyExp=Math.max(1000,+F.exp||def.baseExp);
  const runwayMonths=monthlyExp>0?capital/monthlyExp:0;
  const runwayPct=Math.min(100,(runwayMonths/Math.max(1,F.runwayGoal))*100);
  const runwayGap=Math.max(0,monthlyExp*F.runwayGoal-capital);
  const safeMonthlyNow=(capital*(effSwr/100))/12;
  const expCoveredPct=monthlyExp>0?(safeMonthlyNow/monthlyExp)*100:0;
  const targetByExp=monthlyExp*mult;
  const targetBy300Sal=(def.baseInc||monthlyExp)*300;
  const firePct=targetByExp>0?Math.min(100,(capital/targetByExp)*100):0;
  const fireGap=Math.max(0,targetByExp-capital);
  const rMon=Math.pow(1+(+F.ret||6)/100,1/12)-1;
  const saveMon=Math.max(0,+F.save||0);
  let simCap=capital,monthsToFire=0;
  if(capital<targetByExp){
    while(simCap<targetByExp&&monthsToFire<600){
      simCap=simCap*(1+rMon)+saveMon;
      monthsToFire++;
    }
  }
  const yrsTo=Math.floor(monthsToFire/12),mosTo=monthsToFire%12;
  const targetYear=new Date().getFullYear()+Math.round(monthsToFire/12);
  let etaHtml='';
  if(capital>=targetByExp){
    etaHtml=`<p class="pos" style="font-weight:700;margin:6px 0">🎉 כבר הגעת ליעד שהגדרת! ההון שלך מכסה 100% מהוצאות המחיה לפי כלל ה-${F.swr}%.</p>`;
  }else if(monthsToFire>=600){
    etaHtml=`<p class="mut">בקצב ההפקדה הנוכחי ההגעה ליעד רחוקה מ-50 שנה — נסה להגדיל הפקדה חודשית או להפחית הוצאות.</p>`;
  }else{
    etaHtml=`<div class="hl-box" style="margin-top:8px">
      <div><small class="mut" style="display:block">זמן משוער ליעד (${fmt(targetByExp)})</small><b style="font-size:18px">${yrsTo?yrsTo+' שנים':''}${yrsTo&&mosTo?' ו-':''}${mosTo?mosTo+' חודשים':''}</b></div>
      <span class="chip">שנת ${targetYear}</span>
    </div>
    <p class="mut" style="margin:10px 0 0">חסרים עוד <b>${fmt(fireGap)}</b> ליעד של ${mult} חודשי מחיה (וליעד 300 משכורות מלאות חסרים ${fmt(Math.max(0,targetBy300Sal-capital))}).</p>`;
  }
  return{liquidVal,penVal,capital,mult,monthlyExp,runwayMonths,runwayPct,runwayGap,safeMonthlyNow,expCoveredPct,targetByExp,targetBy300Sal,firePct,saveMon,etaHtml};
}

async function prepareUploadBlob(file){
  if(!file||!file.type||!file.type.startsWith('image/')||file.size<=2621440)return{blob:file,ext:(file.name.split('.').pop()||'jpg').toLowerCase(),mime:file.type||'application/octet-stream'};
  return new Promise(resolve=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const maxDim=2200;let w=img.width,h=img.height;
      if(Math.max(w,h)>maxDim){const sc=maxDim/Math.max(w,h);w=Math.round(w*sc);h=Math.round(h*sc)}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=>{
        if(b)resolve({blob:b,ext:'jpg',mime:'image/jpeg'});
        else resolve({blob:file,ext:(file.name.split('.').pop()||'jpg').toLowerCase(),mime:file.type});
      },'image/jpeg',0.86);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve({blob:file,ext:(file.name.split('.').pop()||'jpg').toLowerCase(),mime:file.type})};
    img.src=url;
  });
}

async function uploadReceiptToDrive(file,meta){
  const findFolder=async(name,parentId)=>{
    const q=`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`+(parentId?` and '${parentId}' in parents`:'');
    const r=await driveFetchWithRetry('https://www.googleapis.com/drive/v3/files?fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true&q='+encodeURIComponent(q));
    if(!r.ok)throw new Error('שגיאת גישה ל-Google Drive ('+r.status+')');
    const j=await r.json();
    return (j.files&&j.files[0])?j.files[0].id:'';
  };
  const createFolder=async(name,parentId)=>{
    const body={name,mimeType:'application/vnd.google-apps.folder'};
    if(parentId)body.parents=[parentId];
    const r=await driveFetchWithRetry('https://www.googleapis.com/drive/v3/files?fields=id,name&supportsAllDrives=true',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!r.ok)throw new Error('לא ניתן ליצור תיקייה בדרייב ('+r.status+')');
    return (await r.json()).id;
  };
  const rootFolder=APP_CONFIG.receiptsRootFolder;
  const subFolder=APP_CONFIG.receiptsSubFolder;
  const filesObj=S.files&&typeof S.files==='object'?S.files:null;
  let rootId=(filesObj&&filesObj.root)||await findFolder(rootFolder,'');
  if(!rootId){
    rootId=await createFolder(rootFolder,'');
    if(filesObj)filesObj.root=rootId;
  }
  let recId=(filesObj&&filesObj.receiptsId)||await findFolder(subFolder,rootId);
  if(!recId){
    recId=await createFolder(subFolder,rootId);
    if(filesObj)filesObj.receiptsId=recId;
  }
  const prep=await prepareUploadBlob(file);
  const clean=s=>String(s||'').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();
  const base=[clean(meta.name),clean(meta.store),clean(meta.purchaseDate)].filter(Boolean).join(' - ')||'קבלה';
  const uploadName=`${base}.${prep.ext}`;
  const boundary='-------myMoneyReceiptBoundary'+Date.now();
  const metaJson=JSON.stringify({name:uploadName,parents:[recId]});
  const headPart=new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metaJson}\r\n--${boundary}\r\nContent-Type: ${prep.mime}\r\n\r\n`]);
  const tailPart=new Blob([`\r\n--${boundary}--`]);
  const multipart=new Blob([headPart,prep.blob,tailPart],{type:`multipart/related; boundary=${boundary}`});
  const upRes=await driveFetchWithRetry('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,name,webViewLink',{
    method:'POST',
    headers:{'Content-Type':`multipart/related; boundary=${boundary}`},
    body:multipart
  });
  if(!upRes.ok)throw new Error('העלאת הקובץ נכשלה ('+upRes.status+')');
  const uploaded=await upRes.json();
  if(filesObj&&Array.isArray(filesObj.out)){
    filesObj.out.unshift({id:uploaded.id,name:uploaded.name,webViewLink:uploaded.webViewLink,g:subFolder});
  }
  return uploaded;
}

  function rememberProduct(name, price, dept, image = "") {
    const key = name.trim().toLowerCase();
    if (!key) return;
    const prev = priceMemory[key];
    priceMemory[key] = {
      name: name.trim(),
      price: Number(price) > 0 ? Number(price) : (prev?.price || 0),
      dept: dept || prev?.dept || "",
      image: String(image || "").trim() || prev?.image || "",
      updatedAt: Date.now()
    };
  }

  function addItem({ name, price = 0, qty = 1, dept = "", image = "" }) {
    const cleanName = name.trim();
    if (!cleanName) return;

    const now = Date.now();
    const mem = priceMemory[cleanName.toLowerCase()];
    const finalPrice = Number(price) > 0 ? Number(price) : (mem?.price || 0);
    const finalDept = dept || mem?.dept || classifyDepartment(cleanName);
    const finalImage = String(image || "").trim() || mem?.image || "";

    const existing = items.find((i) => !i.done && i.name.toLowerCase() === cleanName.toLowerCase());
    if (existing) {
      existing.qty += qty;
      if (finalPrice > 0) existing.price = finalPrice;
      if (finalImage) existing.image = finalImage;
      existing.updatedAt = now;
    } else {
      items.unshift({
        id: now.toString(36) + Math.random().toString(36).slice(2, 6),
        name: cleanName,
        price: finalPrice,
        qty,
        dept: finalDept,
        image: finalImage,
        done: false,
        updatedAt: now
      });
    }

    if (finalPrice > 0 || finalImage) rememberProduct(cleanName, finalPrice, finalDept, finalImage);

  }

  async function handleSearchInput(q) {
    const term = q.trim();
    if (term.length < 2) {
      closeDropdown();
      return;
    }

    const reqId = ++searchSeq;
    if (searchAbort) {
      searchAbort.abort();
      searchAbort = null;
    }

    const localMatches = Object.values(priceMemory)
      .filter((m) => m.name.toLowerCase().includes(term.toLowerCase()))
      .slice(0, 4)
      .map((m) => ({ ...m, image: m.image || "", source: "זיכרון מחירים" }));

    if (!navigator.onLine) {
      if (localMatches.length > 0) renderDropdown(localMatches, false);
      else renderManualFallbackRow(term);
      return;
    }

    const ctrl = new AbortController();
    searchAbort = ctrl;

    renderDropdown(localMatches, true);

    try {
      const res = await fetch(`${WORKER_BASE}/rami?q=${encodeURIComponent(term)}`, { signal: ctrl.signal });
      if (!res.ok) throw new Error("rami_http_" + res.status);
      const data = await res.json();

      if (reqId !== searchSeq) return;
      if (byId("shop-search-input").value.trim() !== term) return;

      if (data.ok && Array.isArray(data.items) && data.items.length > 0) {
        const liveMatches = data.items.map((it) => ({
          name: it.name,
          price: it.price,
          oldPrice: it.oldPrice,
          dept: classifyDepartment(it.name, it.department),
          image: it.image || "",
          source: "רמי לוי אונליין"
        }));
        renderDropdown(liveMatches, false);
      } else if (localMatches.length === 0) {
        renderManualFallbackRow(term);
      } else {
        renderDropdown(localMatches, false);
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;
      if (reqId !== searchSeq) return;
      if (localMatches.length > 0) renderDropdown(localMatches, false);
      else renderManualFallbackRow(term);
    }
  }

  function renderDropdown(list, isLoadingMore) {

  function mergeStates(local, remote) {
    const cutoff = Date.now() - 30 * 864e5;
    const mergedDeleted = {};
    const allDelKeys = new Set([...Object.keys(local.deletedIds || {}), ...Object.keys(remote.deletedIds || {})]);
    allDelKeys.forEach((id) => {
      const ts = Math.max(Number(local.deletedIds?.[id]) || 0, Number(remote.deletedIds?.[id]) || 0);
      if (ts > cutoff) mergedDeleted[id] = ts;
    });

    const itemsById = new Map();
    (remote.items || []).forEach((it) => {
      if (!it || !it.id) return;
      const upd = Number(it.updatedAt) || 0;
      if (mergedDeleted[it.id] && mergedDeleted[it.id] >= upd) return;
      itemsById.set(it.id, { ...it, image: it.image || "", updatedAt: upd });
    });

    (local.items || []).forEach((it) => {
      if (!it || !it.id) return;
      const upd = Number(it.updatedAt) || 0;
      if (mergedDeleted[it.id] && mergedDeleted[it.id] >= upd) return;
      const prev = itemsById.get(it.id);
      if (!prev) {
        itemsById.set(it.id, { ...it, image: it.image || "", updatedAt: upd });
      } else if (upd >= (Number(prev.updatedAt) || 0)) {
        itemsById.set(it.id, { ...it, image: it.image || prev.image || "", updatedAt: upd });
      } else if (!prev.image && it.image) {
        prev.image = it.image;
      }
    });

const finalItems = [];
    const activeByName = new Map();
    for (const it of itemsById.values()) {
      if (!it.done) {
        const norm = it.name.trim().toLowerCase();
        const dup = activeByName.get(norm);
        if (dup) {
          if ((Number(it.updatedAt) || 0) >= (Number(dup.updatedAt) || 0)) {
            dup.qty = Math.max(Number(dup.qty) || 1, Number(it.qty) || 1);
            if (Number(it.price) > 0) dup.price = Number(it.price);
            if (it.dept) dup.dept = it.dept;
            if (it.image) dup.image = it.image;
            dup.updatedAt = Number(it.updatedAt) || dup.updatedAt;
          } else if (!dup.image && it.image) {
            dup.image = it.image;
          }
          continue;
        }
        activeByName.set(norm, it);
      }
      finalItems.push(it);
    }

    const mergedMemory = {};
    const allMemKeys = new Set([...Object.keys(remote.priceMemory || {}), ...Object.keys(local.priceMemory || {})]);
    allMemKeys.forEach((k) => {
      const r = remote.priceMemory?.[k];
      const l = local.priceMemory?.[k];
      if (!r) { mergedMemory[k] = { ...l, image: l.image || "" }; return; }
      if (!l) { mergedMemory[k] = { ...r, image: r.image || "" }; return; }
      const pick = (Number(l.updatedAt) || 0) >= (Number(r.updatedAt) || 0) ? l : r;
      const other = pick === l ? r : l;
      mergedMemory[k] = {
        ...pick,
        price: Number(pick.price) > 0 ? Number(pick.price) : (Number(other.price) || 0),
        dept: pick.dept || other.dept || "",
        image: pick.image || other.image || ""
      };
    });

    const mergedDeletedW = {};
    const allDelWKeys = new Set([...Object.keys(local.deletedWarranties || {}), ...Object.keys(remote.deletedWarranties || {})]);
    allDelWKeys.forEach((id) => {
      const ts = Math.max(Number(local.deletedWarranties?.[id]) || 0, Number(remote.deletedWarranties?.[id]) || 0);
      if (ts > cutoff) mergedDeletedW[id] = ts;
    });

    const wById = new Map();
    (remote.warranties || []).forEach((w) => {
      if (!w || !w.id) return;
      const upd = Number(w.updatedAt) || 0;
      if (mergedDeletedW[w.id] && mergedDeletedW[w.id] >= upd) return;
      wById.set(w.id, { ...w, category: w.category || "", updatedAt: upd });
    });

    (local.warranties || []).forEach((w) => {
      if (!w || !w.id) return;
      const upd = Number(w.updatedAt) || 0;
      if (mergedDeletedW[w.id] && mergedDeletedW[w.id] >= upd) return;
      const prev = wById.get(w.id);
      if (!prev) {
        wById.set(w.id, { ...w, category: w.category || "", updatedAt: upd });
      } else if (upd >= (Number(prev.updatedAt) || 0)) {
        wById.set(w.id, {
          ...w,
          category: w.category || prev.category || "",
          fileId: w.fileId || prev.fileId || "",
          fileName: w.fileName || prev.fileName || "",
          fileLink: w.fileLink || prev.fileLink || "",
          updatedAt: upd
        });
      } else {
        if (!prev.category && w.category) prev.category = w.category;
        if (!prev.fileLink && w.fileLink) {
          prev.fileId = w.fileId || prev.fileId || "";
          prev.fileName = w.fileName || prev.fileName || "";
          prev.fileLink = w.fileLink;
        }
      }
    });

    return {
      items: finalItems,
      priceMemory: mergedMemory,
      deletedIds: mergedDeleted,
      warranties: Array.from(wById.values()),
      deletedWarranties: mergedDeletedW
    };
  }

  async function ensureDriveToken() {
    let tok = window._getAuthToken ? window._getAuthToken() : "";
    if (!tok && window._refreshAuthToken) {
      const ok = await window._refreshAuthToken();
      if (ok && window._getAuthToken) tok = window._getAuthToken();
    }
    return tok;
  }

  async function driveApiFetch(url, options = {}) {
    if (typeof driveFetchWithRetry === "function") {
      return driveFetchWithRetry(url, options);
    }
    const tok = await ensureDriveToken();
    if (!tok) throw new Error("no_auth");
    const headers = { ...(options.headers || {}), Authorization: "Bearer " + tok };
    return fetch(url, { ...options, headers });
  }

  async function resolveDriveFileId() {
    if (driveMeta && driveMeta.fileId) return driveMeta.fileId;
    const safeName = DRIVE_FILE_NAME.replace(/'/g, "\\'");
    const q = `name='${safeName}' and trashed=false`;
    const res = await driveApiFetch(
      "https://www.googleapis.com/drive/v3/files?fields=files(id,name,parents)&supportsAllDrives=true&includeItemsFromAllDrives=true&q=" +
        encodeURIComponent(q)
    );
    if (res.status === 401 || res.status === 403) {
      const err = new Error("need_scope");
      err.code = res.status;
      throw err;
    }
    if (!res.ok) throw new Error("drive_list_" + res.status);
    const data = await res.json();
    if (Array.isArray(data.files) && data.files.length > 0) {
      driveMeta = { fileId: data.files[0].id };
      try { localStorage.setItem(FILE_META_KEY, JSON.stringify(driveMeta)); } catch {}
      return driveMeta.fileId;
    }

    let parentId = "";
    try {
      const rootSafe = APP_CONFIG.receiptsRootFolder.replace(/'/g, "\\'");
      const rq = `name='${rootSafe}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
      const rRes = await driveApiFetch(
        "https://www.googleapis.com/drive/v3/files?fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true&q=" +
          encodeURIComponent(rq)
      );
      if (rRes.ok) {
        const rJson = await rRes.json();
        if (rJson.files && rJson.files[0]) parentId = rJson.files[0].id;
      }
    } catch {}

    const boundary = "-------myMoneyShopBoundary" + Date.now();
    const meta = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
    if (parentId) meta.parents = [parentId];
    const initPayload = JSON.stringify({
      version: 1,
      updatedAt: Date.now(),
      items,
      priceMemory,
      deletedIds,
      warranties,
      deletedWarranties
    });
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${initPayload}\r\n` +
      `--${boundary}--`;

    const cRes = await driveApiFetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id",
      {
        method: "POST",
        headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
        body
      }
    );
    if (cRes.status === 401 || cRes.status === 403) {
      const err = new Error("need_scope");
      err.code = cRes.status;
      throw err;
    }
    if (!cRes.ok) throw new Error("drive_create_" + cRes.status);
    const created = await cRes.json();
    driveMeta = { fileId: created.id };
    try { localStorage.setItem(FILE_META_KEY, JSON.stringify(driveMeta)); } catch {}
    return driveMeta.fileId;
  }

  async function readRemoteState(fileId) {
    const res = await driveApiFetch(
      `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media&supportsAllDrives=true`
    );
    if (res.status === 404) {
      driveMeta = null;
      try { localStorage.removeItem(FILE_META_KEY); } catch {}
      return null;
    }
    if (res.status === 401 || res.status === 403) {
      const err = new Error("need_scope");
      err.code = res.status;
      throw err;
    }
    if (!res.ok) throw new Error("drive_read_" + res.status);
    const txt = await res.text();
    if (!txt || !txt.trim()) return { items: [], priceMemory: {}, deletedIds: {}, warranties: [], deletedWarranties: {} };
    try {
      return JSON.parse(txt);
    } catch {
      return { items: [], priceMemory: {}, deletedIds: {}, warranties: [], deletedWarranties: {} };
    }
  }

  async function writeRemoteState(fileId, payload) {
    const res = await driveApiFetch(
      `https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=media&supportsAllDrives=true`,
      {
        method: "PATCH",
        headers: { "Content-Type": "application/json; charset=UTF-8" },
        body: JSON.stringify({
          version: 1,
          updatedAt: Date.now(),
          ...payload
        })
      }
    );
    if (res.status === 401 || res.status === 403) {
      const err = new Error("need_scope");
      err.code = res.status;
      throw err;
    }
    if (!res.ok) throw new Error("drive_write_" + res.status);
  }

  async function syncWithDrive(mode = "pull", silent = false) {
    if (!navigator.onLine) {
      setSyncPill("off", "לא מקוון");
      return;
    }
    const tok = await ensureDriveToken();
    if (!tok) {
      setSyncPill("off", "מקומי בלבד");
      return;
    }
    if (syncInFlight) {
      if (mode === "push") pendingPush = true;
      return;
    }

    syncInFlight = true;
    if (!silent) setSyncPill("syncing", "מסנכרן...");

    try {
      let fileId = await resolveDriveFileId();
      let remote = await readRemoteState(fileId);
      if (remote === null) {
        fileId = await resolveDriveFileId();
        remote = await readRemoteState(fileId) || {};
      }

      const localSnapshot = { items, priceMemory, deletedIds, warranties, deletedWarranties };
      const merged = mergeStates(localSnapshot, remote);

      const changed =
        JSON.stringify(merged.items) !== JSON.stringify(items) ||
        JSON.stringify(merged.warranties) !== JSON.stringify(warranties) ||
        Object.keys(merged.priceMemory).length !== Object.keys(priceMemory).length;

      items = merged.items;
      priceMemory = merged.priceMemory;
      deletedIds = merged.deletedIds;
      warranties = merged.warranties;
      deletedWarranties = merged.deletedWarranties;
      persistLocal();

      if (mode === "push" || pendingPush || changed) {
        pendingPush = false;
        await writeRemoteState(fileId, merged);
      }

      setSyncPill("ok", "מסונכרן בדרייב");
      render();
      if (typeof S !== "undefined" && S.tab === "more" && S.sub === "wr" && !S.wForm && typeof draw === "function") {
        draw(true);
      }
    } catch (err) {
      if (err && (err.message === "need_scope" || err.code === 401 || err.code === 403)) {
        setSyncPill("need_scope", "נדרשת הרשאת דרייב");
      } else {
        setSyncPill("warn", "שגיאת סנכרון");
      }
    } finally {
      syncInFlight = false;
      if (pendingPush) {
        pendingPush = false;
        scheduleDrivePush();
      }
    }
  }

  async function backfillMissingImages() {
    if (!navigator.onLine) return;
    const candidates = items.filter((it) => !it.image && it.name && !checkedImageNames.has(it.name.trim().toLowerCase())).slice(0, 6);
    if (!candidates.length) return;

    let updated = false;
    for (const it of candidates) {
      const key = it.name.trim().toLowerCase();
      checkedImageNames.add(key);
      try {
        const res = await fetch(`${WORKER_BASE}/rami?q=${encodeURIComponent(it.name.trim())}`);
        if (!res.ok) continue;
        const data = await res.json();
        const hit = data && Array.isArray(data.items) ? data.items.find((x) => x && x.image) : null;
        if (hit && hit.image) {
          it.image = hit.image;
          it.updatedAt = Date.now();
          rememberProduct(it.name, it.price || hit.price || 0, it.dept, hit.image);
          updated = true;
        }
      } catch {}
    }

    if (updated) {
      persistLocal();
      render();
      scheduleDrivePush();
    }
  }

  function toggleItem(id) {
    const it = items.find((x) => x.id === id);
    if (!it) return;
    it.done = !it.done;
    it.updatedAt = Date.now();
    saveState(true);
  }

  function changeQty(id, delta) {
    const it = items.find((x) => x.id === id);
    if (!it) return;
    const next = (Number(it.qty) || 1) + delta;
    if (next <= 0) {
      deleteItem(id);
      return;
    }
    it.qty = next;
    it.updatedAt = Date.now();
    saveState(true);
  }

  function deleteItem(id) {
    items = items.filter((x) => x.id !== id);
    markDeleted(id);
    if (editingPriceItemId === id) editingPriceItemId = null;
    saveState(true);
  }

  function startEditPrice(id) {
    editingPriceItemId = id;
    render();
    setTimeout(() => {
      const inp = document.querySelector(`[data-price-inp="${id}"]`);
      if (inp) { inp.focus(); inp.select(); }
    }, 30);
  }

  function commitEditPrice(id, rawVal) {
    const it = items.find((x) => x.id === id);
    editingPriceItemId = null;
    if (!it) { render(); return; }
    const val = Math.max(0, Math.round((parseFloat(String(rawVal || "0").replace(",", ".")) || 0) * 100) / 100);
    it.price = val;
    it.updatedAt = Date.now();
    if (val > 0) rememberProduct(it.name, val, it.dept, it.image);
    saveState(true);
  }

  function clearDoneItems() {
    const doneList = items.filter((x) => x.done);
    if (!doneList.length) return;
    doneList.forEach((x) => markDeleted(x.id));
    items = items.filter((x) => !x.done);
    saveState(true);
  }

  function shareList() {
    const active = items.filter((x) => !x.done);
    if (!active.length) {
      showShareBanner("אין מוצרים פתוחים ברשימה לשיתוף.");
      return;
    }
    const lines = active.map((x) => `• ${x.name}${x.qty > 1 ? ` (×${x.qty})` : ""}${x.price > 0 ? ` — ${fmtMoney(x.price * x.qty)}` : ""}`);
    const total = active.reduce((s, x) => s + (Number(x.price) || 0) * (Number(x.qty) || 1), 0);
    const payload = active.map((x) => ({ n: x.name, q: x.qty, p: x.price, d: x.dept }));
    const shareUrl = `${location.origin}${location.pathname}#shop=${encodeURIComponent(JSON.stringify(payload))}`;
    const text = `רשימת קניות (${active.length} פריטים):\n${lines.join("\n")}${total > 0 ? `\nסה״כ משוער: ${fmtMoney(total)}` : ""}\n\nלייבוא לאפליקציה:\n${shareUrl}`;

    if (navigator.share) {
      navigator.share({ title: "רשימת קניות", text }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        showShareBanner("הרשימה וקישור הייבוא הועתקו ללוח ✓");
      }).catch(() => {});
    }
  }

  function importFromHashIfPresent() {
    if (!location.hash.startsWith("#shop=")) return;
    try {
      const raw = decodeURIComponent(location.hash.slice(6));
      const arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length) {
        arr.forEach((x) => {
          if (x && x.n) {
            addItem({ name: String(x.n), qty: Number(x.q) || 1, price: Number(x.p) || 0, dept: String(x.d || "") });
          }
        });
        showShareBanner(`יובאו ${arr.length} פריטים לרשימת הקניות ✓`);
      }
    } catch {}
    history.replaceState(null, "", location.pathname + location.search);
  }

  function renderDeptGroups(list) {
    const groups = new Map();
    list.forEach((it) => {
      const d = it.dept || classifyDepartment(it.name);
      if (!groups.has(d)) groups.set(d, []);
      groups.get(d).push(it);
    });

    const sortedDepts = [...groups.keys()].sort((a, b) => {
      const ia = DEPT_ORDER.indexOf(a);
      const ib = DEPT_ORDER.indexOf(b);
      if (ia >= 0 && ib >= 0) return ia - ib;
      if (ia >= 0) return -1;
      if (ib >= 0) return 1;
      return a.localeCompare(b, "he");
    });

    return sortedDepts.map((dept) => {
      const groupItems = groups.get(dept);
      const subTot = groupItems.reduce((s, x) => s + (Number(x.price) || 0) * (Number(x.qty) || 1), 0);
      return `<details class="card shop-dept" open>
        <summary>
          <span>${esc(dept)} <small class="mut">(${groupItems.length})</small></span>
          ${subTot > 0 ? `<span class="shop-dept-sub">${fmtMoney(subTot)}</span>` : ""}
        </summary>
        ${groupItems.map(renderItemRow).join("")}
      </details>`;
    }).join("");
  }

  function render() {
    const totalEst = items.reduce((s, x) => s + (Number(x.price) || 0) * (Number(x.qty) || 1), 0);
    const leftEst = items.filter((x) => !x.done).reduce((s, x) => s + (Number(x.price) || 0) * (Number(x.qty) || 1), 0);
    const doneCount = items.filter((x) => x.done).length;

    const setTxt = (id, v) => { const el = byId(id); if (el) el.textContent = v; };
    setTxt("shop-total-all", fmtMoney(totalEst));
    setTxt("shop-total-left", fmtMoney(leftEst));
    setTxt("shop-progress", `${doneCount}/${items.length}`);
    setTxt("shop-float-left", fmtMoney(leftEst));
    setTxt("shop-float-all", fmtMoney(totalEst));

    document.querySelectorAll("#page-shopping [data-filter]").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.filter === currentFilter);
    });

    const groupsEl = byId("shop-groups-container");
    const doneEl = byId("shop-done-container");
    if (!groupsEl) return;

    const openItems = items.filter((it) => !it.done);
    const doneItems = items.filter((it) => !!it.done);

    if (!items.length) {
      groupsEl.innerHTML = `<div class="card"><p class="mut" style="margin:0;text-align:center">רשימת הקניות ריקה. חפש מוצר למעלה כדי להתחיל.</p></div>`;
      if (doneEl) doneEl.innerHTML = "";
      return;
    }

    if (currentFilter === "todo") {
      groupsEl.innerHTML = openItems.length
        ? renderDeptGroups(openItems)
        : `<div class="card"><p class="mut" style="margin:0;text-align:center">כל הפריטים ברשימה כבר נאספו ✓</p></div>`;
      if (doneEl) doneEl.innerHTML = "";
      return;
    }

    if (currentFilter === "done") {
      groupsEl.innerHTML = doneItems.length
        ? renderDeptGroups(doneItems)
        : `<div class="card"><p class="mut" style="margin:0;text-align:center">עדיין לא סומנו פריטים שנקנו.</p></div>`;
      if (doneEl) doneEl.innerHTML = "";
      return;
    }

    groupsEl.innerHTML = openItems.length
      ? renderDeptGroups(openItems)
      : `<div class="card"><p class="mut" style="margin:0;text-align:center">כל הפריטים ברשימה נאספו לעגלה ✓</p></div>`;

    if (doneEl) {
      if (doneItems.length) {
        const doneTot = doneItems.reduce((s, x) => s + (Number(x.price) || 0) * (Number(x.qty) || 1), 0);
        doneEl.innerHTML = `<details class="card shop-dept" open>
          <summary>
            <span>✅ נאספו לעגלה <small class="mut">(${doneItems.length})</small></span>
            ${doneTot > 0 ? `<span class="shop-dept-sub">${fmtMoney(doneTot)}</span>` : ""}
          </summary>
          ${doneItems.map(renderItemRow).join("")}
        </details>`;
      } else {
        doneEl.innerHTML = "";
      }
    }
  }

  const searchInp = byId("shop-search-input");
  if (searchInp) {
    searchInp.addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      const val = e.target.value;
      searchTimer = setTimeout(() => handleSearchInput(val), 220);
    });
    searchInp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        if (searchInp.value.trim()) addItem({ name: searchInp.value });
      } else if (e.key === "Escape") {
        closeDropdown();
      }
    });
  }

  document.addEventListener("click", (e) => {
    const shopPage = byId("page-shopping");
    if (!e.target.closest("#shop-search-input, #shop-dropdown")) {
      const dd = byId("shop-dropdown");
      if (dd && dd.classList.contains("open")) closeDropdown();
    }
    if (!shopPage || !shopPage.contains(e.target)) return;

    const btn = e.target.closest("button,[data-filter],[data-stog],[data-sqty],[data-sdel],[data-sprice]");
    if (!btn) return;

    if (btn.id === "shop-manual-add") {
      if (searchInp && searchInp.value.trim()) addItem({ name: searchInp.value });
      return;
    }
    if (btn.id === "shop-sync-pill" || btn.id === "shop-sync-btn") {
      if (syncStatus.state === "need_scope" && window._upgradeDriveScope) {
        window._upgradeDriveScope();
      } else {
        syncWithDrive("pull", false);
      }
      return;
    }
    if (btn.id === "shop-share-btn") { shareList(); return; }
    if (btn.id === "shop-clear-done") { clearDoneItems(); return; }
    if (btn.dataset.filter) {
      currentFilter = btn.dataset.filter;
      render();
      return;
    }
    if (btn.dataset.stog) { toggleItem(btn.dataset.stog); return; }
    if (btn.dataset.sqty) {
      const [id, d] = btn.dataset.sqty.split(":");
      changeQty(id, Number(d));
      return;
    }
    if (btn.dataset.sdel) { deleteItem(btn.dataset.sdel); return; }
    if (btn.dataset.sprice) { startEditPrice(btn.dataset.sprice); return; }
  });

  document.addEventListener("keydown", (e) => {
    if (e.target && e.target.dataset && e.target.dataset.priceInp) {
      if (e.key === "Enter") {
        e.preventDefault();
        commitEditPrice(e.target.dataset.priceInp, e.target.value);
      } else if (e.key === "Escape") {
        editingPriceItemId = null;
        render();
      }
    }
  });

  document.addEventListener("focusout", (e) => {
    if (e.target && e.target.dataset && e.target.dataset.priceInp) {
      commitEditPrice(e.target.dataset.priceInp, e.target.value);
    }
  });

  window._getWarranties = () => warranties;
  window._saveWarranty = (rec) => {
    if (!rec || !rec.id) return;
    delete deletedWarranties[rec.id];
    const idx = warranties.findIndex((w) => w.id === rec.id);
    if (idx >= 0) warranties[idx] = rec;
    else warranties.unshift(rec);
    persistLocal();
    scheduleDrivePush();
  };
  window._deleteWarranty = (id) => {
    if (!id) return;
    warranties = warranties.filter((w) => w.id !== id);
    deletedWarranties[id] = Date.now();
    persistLocal();
    scheduleDrivePush();
  };
  window._shopSync = (mode = "pull", silent = false) => syncWithDrive(mode, silent);
  window._shopRender = () => render();

  importFromHashIfPresent();
  render();
  syncWithDrive("pull", true).then(() => backfillMissingImages());
})();
</script></body></html>
