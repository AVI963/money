<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#070b12" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>הכסף שלי</title>
<style>
:root{
  --bg:#f2f5fb;--card:#ffffff;--card2:#f6f8fd;--ink:#0b1220;--mut:#64748b;--line:#e6ebf4;
  --brd:#e6ebf4;--txt:#0b1220;--acc:#1a73e8;--ok:#16a34a;--bad:#dc2626;
  --g:#10b981;--g2:#059669;--gs:#e2f8f0;--r:#ef4444;--rs:#feeceb;--w:#f59e0b;--ws:#fef3c7;--b:#4f6bed;--bs:#eef2ff;
  --bd:rgba(15,23,42,.065);--in-hi:rgba(255,255,255,.92);
  --sh:0 12px 32px -14px rgba(15,23,42,.12),0 2px 6px -1px rgba(15,23,42,.04);
  --sh-lg:0 22px 46px -16px rgba(15,23,42,.16),0 4px 14px -2px rgba(15,23,42,.05);
  --glass:rgba(255,255,255,.88);--glass-bd:rgba(255,255,255,.78);
  --nav-sh:0 18px 42px -10px rgba(15,23,42,.2),0 2px 10px -2px rgba(15,23,42,.06)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#070b12;--card:#0f1622;--card2:#151f2e;--ink:#f1f5f9;--mut:#8b9bb0;--line:#1c2738;
  --brd:#1c2738;--txt:#f1f5f9;--acc:#60a5fa;--ok:#34d399;--bad:#f87171;
  --g:#10b981;--g2:#34d399;--gs:rgba(16,185,129,.16);--r:#f87171;--rs:rgba(239,68,68,.16);--w:#fbbf24;--ws:rgba(245,158,11,.16);--b:#6366f1;--bs:rgba(99,102,241,.16);
  --bd:rgba(255,255,255,.075);--in-hi:rgba(255,255,255,.055);
  --sh:0 14px 36px -14px rgba(0,0,0,.65),0 2px 8px -2px rgba(0,0,0,.35);
  --sh-lg:0 22px 48px -16px rgba(0,0,0,.78);
  --glass:rgba(15,22,34,.88);--glass-bd:rgba(255,255,255,.1);
  --nav-sh:0 20px 46px -10px rgba(0,0,0,.78)
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 Heebo,system-ui,-apple-system,Arial,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(108px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden
}
body::before{
  content:"";position:fixed;inset:0 0 auto 0;height:300px;pointer-events:none;z-index:-1;
  background:radial-gradient(85% 90% at 15% 0%,rgba(16,185,129,.11),transparent 65%),
             radial-gradient(75% 80% at 88% 4%,rgba(79,107,237,.10),transparent 62%)
}
main{max-width:560px;margin:0 auto;padding:8px 16px}
button,summary,.mp-bar,.mp-pill,.cf-col,.bars>div,.mtile,.donut-wrap,.lg-row,.dots i{user-select:none;-webkit-user-select:none}
button{transition:transform .18s cubic-bezier(.22,1,.36,1),background-color .22s,opacity .2s,box-shadow .22s,border-color .22s,color .2s}
button:active:not(:disabled){transform:scale(.95)}

/* Header */
header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 10px;gap:12px}
.hdr-title{display:flex;flex-direction:column;gap:2px}
header b{font-size:22px;font-weight:800;letter-spacing:-.35px;line-height:1.15}
.hdr-meta{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut)}
.sync-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.sync-pill i{width:6px;height:6px;border-radius:50%;background:var(--g);display:inline-block}
.sync-pill.busy i{background:var(--w);animation:pulse 1s infinite}
.sync-pill.off i{background:var(--mut)}
@keyframes pulse{50%{opacity:.3}}
header .hdr-acts{display:flex;align-items:center;gap:8px}
header button{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 var(--in-hi),var(--sh);color:var(--ink);padding:0}
header button:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 var(--in-hi),var(--sh-lg)}
header button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header button.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* View & Staggered Card Animations */
.view{animation:in .28s cubic-bezier(.22,1,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.view > .card,.view > .grid,.view > .mgrid{animation:cardUp .38s cubic-bezier(.22,1,.36,1) both}
.view > :nth-child(2){animation-delay:.03s}
.view > :nth-child(3){animation-delay:.06s}
.view > :nth-child(4){animation-delay:.09s}
.view > :nth-child(5){animation-delay:.12s}
.view > :nth-child(6){animation-delay:.15s}
.view.no-anim,.view.no-anim > *,.view.no-anim .bar i,.view.no-anim .cf-bar{animation:none!important;transition:none!important}
@keyframes cardUp{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.view,.view>*,.bar i,.pace-fill,.cf-bar,.bars b,header button.spin svg,.sync-pill.busy i{animation:none!important;transition:none!important}}

/* Banner */
.bn{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 14px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;box-shadow:inset 0 1px 0 var(--in-hi),var(--sh)}
.bn button{border:0;background:var(--g);color:#fff;border-radius:11px;padding:6px 14px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}

/* Elevated Premium Cards */
.card{
  background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:19px;margin:12px 0;
  box-shadow:inset 0 1px 0 var(--in-hi),var(--sh)
}
.hg{
  position:relative;overflow:hidden;
  background:
    radial-gradient(120% 95% at 0% 0%,rgba(16,185,129,.17) 0%,rgba(79,107,237,.11) 48%,transparent 100%),
    var(--card);
  box-shadow:inset 0 1px 0 var(--in-hi),var(--sh-lg);
  transition:background .35s ease
}
.hg.warn{background:radial-gradient(120% 95% at 0% 0%,rgba(245,158,11,.19) 0%,rgba(16,185,129,.08) 52%,transparent 100%),var(--card)}
.hg.bad{background:radial-gradient(120% 95% at 0% 0%,rgba(239,68,68,.19) 0%,rgba(245,158,11,.09) 52%,transparent 100%),var(--card)}

/* Smart Status Pill */
.dpill{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--card);border:1px solid var(--bd);border-radius:99px;
  padding:8px 14px;margin:2px 0 12px;font-size:12.5px;font-weight:700;
  box-shadow:inset 0 1px 0 var(--in-hi),var(--sh)
}
.dpill .dp-main{display:flex;align-items:center;gap:8px;min-width:0}
.dpill .dp-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3.5px var(--gs)}
.dpill.warn .dp-dot{background:var(--w);box-shadow:0 0 0 3.5px var(--ws)}
.dpill.bad .dp-dot{background:var(--r);box-shadow:0 0 0 3.5px var(--rs)}
.dpill .dp-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpill .dp-sub{flex:none;font-size:11.5px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}

/* Run-Rate Forecast Sub-panel inside Hero */
.rr-box{
  margin-top:14px;padding:12px 15px;border-radius:18px;
  background:var(--card2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.rr-l{display:flex;flex-direction:column;gap:1px;min-width:0}
.rr-l .rr-lbl{font-size:12px;font-weight:600;color:var(--mut)}
.rr-l .rr-val{font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.15}
.rr-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}

/* Monthly Variable Pace Bar + Today Marker */
.pace-box{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.pace-hdr{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:26px;font-variant-numeric:tabular-nums}
.pace-track{position:relative;height:10px;border-radius:99px;background:var(--line);overflow:visible}
.pace-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g2),var(--g));transform-origin:right center;animation:growX .55s cubic-bezier(.22,1,.36,1);transition:width .4s cubic-bezier(.22,1,.36,1),background .3s}
.pace-fill.warn{background:linear-gradient(90deg,#d97706,var(--w))}
.pace-fill.bad{background:linear-gradient(90deg,#dc2626,var(--r))}
.pace-now{position:absolute;top:-4px;bottom:-4px;width:2.5px;background:var(--ink);border-radius:2px;z-index:2;transform:translateX(50%)}
.pace-now-lbl{position:absolute;top:-20px;transform:translateX(50%);font-size:10px;font-weight:700;color:var(--ink);white-space:nowrap;background:var(--card);padding:0 6px;border-radius:6px;border:1px solid var(--bd);box-shadow:0 2px 5px rgba(0,0,0,.07)}
.pace-ft{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:7px;font-variant-numeric:tabular-nums}

/* Quiet Trends Sparklines */
.tr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tr-row:first-of-type{border-top:0;padding-top:4px}
.tr-info{flex:1;min-width:0}
.tr-info b{display:block;font-size:13.5px}
.tr-info small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-spk{flex:none;width:74px;height:28px}

/* Modern Scrollable Month Strip + Quick Calendar Button */
.mp-bar{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.mp-strip{
  flex:1;display:flex;align-items:center;gap:6px;overflow-x:auto;
  scrollbar-width:none;scroll-snap-type:x proximity;padding:3px 2px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)
}
.mp-strip::-webkit-scrollbar{display:none}
.mp-pill{
  flex:none;scroll-snap-align:center;border:1px solid var(--bd);background:var(--card);color:var(--mut);
  border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  box-shadow:inset 0 1px 0 var(--in-hi),0 2px 8px -3px rgba(15,23,42,.08)
}
.mp-pill.on{
  background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:800;
  padding:7px 17px;box-shadow:0 8px 20px -6px rgba(15,23,42,.32)
}
.mp-cal{
  flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);
  box-shadow:inset 0 1px 0 var(--in-hi),var(--sh);padding:0
}
.mp-cal svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Month Picker Bottom Sheet */
.ms-back{
  position:fixed;inset:0;background:rgba(7,11,18,.48);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease
}
@keyframes fadeIn{from{opacity:0}}
.ms-sheet{
  width:100%;max-width:560px;max-height:78vh;overflow-y:auto;background:var(--card);
  border-top-left-radius:28px;border-top-right-radius:28px;border:1px solid var(--bd);
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 48px rgba(0,0,0,.25);
  animation:sheetUp .26s cubic-bezier(.22,1,.36,1)
}
@keyframes sheetUp{from{transform:translateY(100%)}}
.ms-grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.ms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.ms-cell{
  border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:16px;
  padding:10px 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px
}
.ms-cell.on{background:var(--gs);border-color:var(--g);color:var(--g2)}
@media(prefers-color-scheme:dark){.ms-cell.on{color:var(--g)}}
.ms-cell b{font-size:14px;font-weight:800}
.ms-cell small{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.ms-cell.on small{color:inherit;font-weight:700}

/* Typography & Badges */
.lb{color:var(--mut);font-size:13px;font-weight:500}
.big{font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1.1;font-variant-numeric:tabular-nums;margin:3px 0}
.chips-inline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700;background:var(--gs);color:var(--g);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.chip.warn{background:var(--ws);color:#b45309}@media(prefers-color-scheme:dark){.chip.warn{color:var(--w)}}
.chip.bad{background:var(--rs);color:var(--r)}
.chip.mut{background:var(--card2);color:var(--mut);border:1px solid var(--bd);font-weight:600}
.trio{display:flex;border-top:1px solid var(--line);margin-top:15px;padding-top:13px}
.trio div{flex:1;text-align:center}
.trio b{display:block;font-size:16.5px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.trio div+div{border-inline-start:1px solid var(--line)}

/* Redesigned Income vs Expense Cashflow Chart */
.cf-grid{display:flex;gap:6px;height:152px;direction:rtl;margin-top:12px;align-items:stretch}
.cf-col{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:5px;padding:6px 3px 5px;border-radius:14px;cursor:pointer;
  transition:background .2s,transform .18s
}
.cf-col:hover{background:var(--card2)}
.cf-col.on{background:var(--card2);box-shadow:inset 0 0 0 1px var(--bd)}
.cf-net{font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px;line-height:1;height:13px}
.cf-bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;min-height:0}
.cf-bar{
  width:13px;border-radius:7px 7px 4px 4px;transform-origin:bottom center;
  animation:growY .5s cubic-bezier(.22,1,.36,1) both;transition:height .35s cubic-bezier(.22,1,.36,1)
}
.cf-bar.inc{background:linear-gradient(180deg,#34d399,#10b981);box-shadow:0 4px 10px -4px rgba(16,185,129,.45)}
.cf-bar.exp{background:linear-gradient(180deg,#fb7185,#ef4444);box-shadow:0 4px 10px -4px rgba(239,68,68,.4)}
.cf-bar.ghost{background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.cf-col small{font-size:11px;color:var(--mut);font-weight:600}
.cf-col.on small{color:var(--g);font-weight:800}

/* Legacy Bars (Mortgage actual charges) */
.bars{display:flex;gap:8px;height:130px;direction:rtl;position:relative;margin-top:10px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;gap:5px;height:100%;position:relative;z-index:1}
.bars b{width:100%;max-width:34px;border-radius:10px;background:var(--line);transform-origin:bottom center;animation:growY .5s cubic-bezier(.22,1,.36,1) both;transition:.25s}.bars .on b{background:var(--g)}.bars small{font-size:11px;color:var(--mut)}

/* Interactive SVG Area Chart */
.svgc{position:relative;margin-top:12px;user-select:none;-webkit-user-select:none;touch-action:auto}
.svgc svg{width:100%;height:146px;display:block;overflow:visible;cursor:crosshair}
.svgc .scrub-tip{position:absolute;top:-8px;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;white-space:nowrap;pointer-events:none;box-shadow:0 8px 20px -4px rgba(0,0,0,.35);opacity:0;transition:opacity .15s;font-variant-numeric:tabular-nums;z-index:3}
.svgc .scrub-tip.on{opacity:1}
.svgc .xlabs{display:flex;justify-content:space-between;direction:ltr;padding:5px 6px 0;font-size:11px;color:var(--mut)}
.svgc .xlabs span{text-align:center;min-width:28px;transition:color .15s,font-weight .15s}
.svgc .xlabs span.on{color:var(--g);font-weight:700}

/* Headings & Rows */
h2{font-size:17px;font-weight:800;margin:0 0 6px;letter-spacing:-.25px}
.mut{color:var(--mut);font-size:13px}.pos{color:var(--g)}.neg{color:var(--r)}

/* Smooth Category Accordion & Outlier Toggle */
details.ct{border-top:1px solid var(--line)}details.ct:first-of-type{border:0}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;transition:opacity .18s}summary::-webkit-details-marker{display:none}
.ci{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:21px;transition:transform .2s cubic-bezier(.22,1,.36,1)}
details.ct[open] .ci{transform:scale(1.06)}
.cn{flex:1;display:flex;flex-direction:column;min-width:0}.cn small{color:var(--mut);font-size:12px}
.ca{text-align:end;font-variant-numeric:tabular-nums}.ca b{display:block;font-size:15.5px}.ca small{font-size:11.5px;font-weight:700}
.chev{width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .24s cubic-bezier(.22,1,.36,1);flex:none}
details.ct[open] .chev{transform:rotate(180deg)}
.ct-body{overflow:hidden}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:-2px 0 8px}.bar i{display:block;height:100%;border-radius:99px;transform-origin:right center;animation:growX .5s cubic-bezier(.22,1,.36,1) both;transition:width .35s cubic-bezier(.22,1,.36,1)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 56px 8px 2px;font-size:13.5px;color:var(--mut);border-top:1px dashed var(--line);transition:opacity .2s}
.it:first-of-type{border-top:0}
.it.ex-off{opacity:.58}
.it.ex-off .it-name{text-decoration:line-through}
.it-day{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums;margin-inline-end:5px}
.it-r{display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap}
.ex-btn{
  border:1px solid var(--line);background:var(--card2);color:var(--mut);
  border-radius:99px;padding:3px 9px;font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;
  white-space:nowrap;flex:none
}
.ex-btn.on{background:var(--ws);border-color:rgba(245,158,11,.35);color:#b45309}
@media(prefers-color-scheme:dark){.ex-btn.on{color:var(--w)}}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}.row.s{font-size:14px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:14px 0 6px;gap:2px;direction:ltr}.stack i{display:block;height:100%;transition:width .4s cubic-bezier(.22,1,.36,1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.grid b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}

/* Coupons & Docs & Menu */
.cp{
  position:relative;display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--bd);border-radius:22px;
  padding:14px;margin:10px 0;box-shadow:inset 0 1px 0 var(--in-hi),var(--sh)
}
.cp .am{flex:none;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:0 8px 18px -6px rgba(0,0,0,.25)}
.cp>div:nth-child(2){flex:1;min-width:0}
button.pr{border:0;border-radius:13px;padding:9px 14px;background:var(--ink);color:var(--card);font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none}
button.pr.ok{background:var(--g);color:#fff}

/* Customizable More Grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0}
.mtile{

  const nameLow = String(productName || "").toLowerCase();
  const deptLow = String(ramiDept || "").toLowerCase();
  for (const rule of SPECIFIC_RULES) {

function safeParse(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v !== null && v !== undefined ? v : fallback;

  }
}

  const txt = $("shop-sync-txt");

  btn.className = "shop-sync-btn";
  const hasAuth = !!(window._driveAuth && window._driveAuth.getToken());

  if (syncState === "need_scope") {
    btn.classList.add("warn");
    txt.textContent = "אשר הרשאת כתיבה ב-Drive";
    return;
  }
  if (syncState === "syncing") {
    btn.classList.add("busy");
    txt.textContent = "מסנכרן מול Drive...";
    return;
  }
  if (syncState === "pending") {
    btn.classList.add("busy");
    txt.textContent = "שומר ל-Drive...";
    return;
  }
  if (syncState === "error") {
    btn.classList.add("err");
    txt.textContent = "שגיאת סנכרון · נסה שוב";
    return;
  }
  if (!hasAuth && !localStorage.getItem("rt")) {
    txt.textContent = "שמור מקומית · התחבר לסנכרון";

  const mem = priceMemory[cleanName.toLowerCase()];
  const finalPrice = Number(price) > 0 ? Number(price) : (mem?.price || 0);
  const finalDept = dept || mem?.dept || classifyDepartment(cleanName);

  const existing = items.find((i) => !i.done && i.name.toLowerCase() === cleanName.toLowerCase());
  if (existing) {
    existing.qty += qty;
    if (finalPrice > 0) existing.price = finalPrice;
    existing.updatedAt = now;
  } else {
    items.unshift({
      id: now.toString(36) + Math.random().toString(36).slice(2, 6),
      name: cleanName,
      price: finalPrice,
      qty,
      dept: finalDept,
      done: false,
      updatedAt: now
    });
  }

  if (finalPrice > 0) rememberProduct(cleanName, finalPrice, finalDept);
  $("shop-search-input").value = "";
  closeDropdown();
  saveState();
}

// === מנוע סנכרון דו-כיווני מול Google Drive דרך ה-Worker ===
async function driveRequest(url, opts = {}, retry = true) {
  const auth = window._driveAuth;
  if (!auth) return { status: 401, noAuth: true };
  let tok = auth.getToken();
  if (!tok && auth.refresh) {
    const ok = await auth.refresh();
    if (ok) tok = auth.getToken();
  }
  if (!tok) return { status: 401, noAuth: true };

  const headers = { ...(opts.headers || {}), Authorization: "Bearer " + tok };
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401 && retry && auth.refresh) {
    const ok = await auth.refresh();
    if (ok) return driveRequest(url, opts, false);
  }
  return res;
}

async function findDriveFileId() {
  const cached = localStorage.getItem(DRIVE_ID_KEY);
  if (cached) return cached;

  const q = `name = '${DRIVE_FILE_NAME}' and trashed = false`;
  const url = `https://www.googleapis.com/drive/v3/files?fields=files(id,name,modifiedTime)&orderBy=${encodeURIComponent("modifiedTime desc")}&pageSize=1&q=${encodeURIComponent(q)}`;
  const res = await driveRequest(url);
  if (res.noAuth || !res.ok) return { errStatus: res.status };
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    localStorage.setItem(DRIVE_ID_KEY, data.files[0].id);
    return data.files[0].id;
  }
  return null;
}

async function readRemoteState(fileId) {
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  if (res.status === 404) {
    localStorage.removeItem(DRIVE_ID_KEY);
    return { notFound: true };
  }
  if (!res.ok) return { errStatus: res.status };
  try {
    const json = await res.json();
    return { data: json };
  } catch {
    return { data: null };
  }
}

async function writeRemoteState(payload, fileId) {
  const serialized = JSON.stringify(payload);
  if (fileId) {
    const res = await driveRequest(
      `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
      {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: serialized
      }
    );
    if (res.status === 404) {
      localStorage.removeItem(DRIVE_ID_KEY);
      return writeRemoteState(payload, null);
    }
    if (res.status === 403) return { needScope: true };
    if (!res.ok) return { errStatus: res.status };
    return { ok: true, id: fileId };
  }

  const boundary = "-------mymoneyshop" + Date.now().toString(36);
  const metadata = JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: "application/json" });
  const multipartBody =
    `--${boundary}
` +
    `Content-Type: application/json; charset=UTF-8

` +
    `${metadata}
` +
    `--${boundary}
` +
    `Content-Type: application/json

` +
    `${serialized}
` +
    `--${boundary}--`;

  const res = await driveRequest(
    "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
    {
      method: "POST",
      headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
      body: multipartBody
    }
  );
  if (res.status === 403) return { needScope: true };
  if (!res.ok) return { errStatus: res.status };
  const created = await res.json();
  if (created && created.id) {
    localStorage.setItem(DRIVE_ID_KEY, created.id);
  }
  return { ok: true, id: created?.id };
}

function mergeStates(local, remote) {
  if (!remote || typeof remote !== "object") return local;

  const mergedDeleted = { ...(remote.deletedIds || {}), ...(local.deletedIds || {}) };
  for (const id of Object.keys(mergedDeleted)) {
    mergedDeleted[id] = Math.max(remote.deletedIds?.[id] || 0, local.deletedIds?.[id] || 0);
  }

  const byId = new Map();
  const rItems = Array.isArray(remote.items) ? remote.items : [];
  const lItems = Array.isArray(local.items) ? local.items : [];

  for (const it of rItems) {
    if (!it || !it.id) continue;
    byId.set(it.id, { ...it, updatedAt: it.updatedAt || remote.updatedAt || 0 });
  }
  for (const it of lItems) {
    if (!it || !it.id) continue;
    const prev = byId.get(it.id);
    const lTime = it.updatedAt || local.updatedAt || 0;
    if (!prev || lTime >= (prev.updatedAt || 0)) {
      byId.set(it.id, { ...it, updatedAt: lTime });
    }
  }

  // שימור סדר הופעה הגיוני (מקומי חדש בראש, ואחריו פריטים מרוחקים חדשים)
  const orderedIds = [];
  const seen = new Set();
  for (const it of lItems) {
    if (it?.id && !seen.has(it.id)) { seen.add(it.id); orderedIds.push(it.id); }
  }
  for (const it of rItems) {
    if (it?.id && !seen.has(it.id)) { seen.add(it.id); orderedIds.push(it.id); }
  }

  const mergedItems = [];
  for (const id of orderedIds) {
    const it = byId.get(id);
    if (!it) continue;
    const delAt = mergedDeleted[id] || 0;
    if (delAt >= (it.updatedAt || 0)) continue;
    mergedItems.push(it);
  }

  const mergedMem = { ...(remote.priceMemory || {}) };
  for (const [k, v] of Object.entries(local.priceMemory || {})) {
    const rv = mergedMem[k];
    if (!rv || (v.updatedAt || 0) >= (rv.updatedAt || 0)) {
      mergedMem[k] = v;
    }
  }

  return {
    version: 1,
    updatedAt: Math.max(local.updatedAt || 0, remote.updatedAt || 0),
    items: mergedItems,
    deletedIds: mergedDeleted,
    priceMemory: mergedMem
  };
}

function buildPayload() {
  pruneTombstones();
  return {
    version: 1,
    updatedAt: meta.updatedAt || Date.now(),
    items,
    deletedIds,
    priceMemory
  };
}

function statesDiffer(a, b) {
  if (!b) return true;
  return JSON.stringify({ items: a.items, deletedIds: a.deletedIds, priceMemory: a.priceMemory }) !==
         JSON.stringify({ items: b.items || [], deletedIds: b.deletedIds || {}, priceMemory: b.priceMemory || {} });
}

function scheduleDrivePush() {
  if (syncState === "need_scope") return;
  syncState = "pending";
  updateSyncBadge();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncWithDrive(true), 1400);
}

async function syncWithDrive(pushLocalChanges = false) {
  if (isSyncing) {
    if (pushLocalChanges) scheduleDrivePush();
    return;
  }
  const auth = window._driveAuth;
  if (!auth || (!auth.getToken() && !localStorage.getItem("rt"))) {
    syncState = "offline";
    updateSyncBadge();
    return;
  }

  isSyncing = true;
  const startRev = localRevision;
  syncState = "syncing";
  updateSyncBadge();

  try {
    let fileId = await findDriveFileId();
    if (fileId && typeof fileId === "object" && fileId.errStatus) {
      throw new Error("Drive list failed: " + fileId.errStatus);
    }

    let remoteData = null;
    if (fileId) {
      const readRes = await readRemoteState(fileId);
      if (readRes.notFound) {
        fileId = null;
      } else if (readRes.errStatus) {
        throw new Error("Drive read failed: " + readRes.errStatus);
      } else {
        remoteData = readRes.data;
      }
    }

    const localSnapshot = buildPayload();
    const merged = remoteData ? mergeStates(localSnapshot, remoteData) : localSnapshot;

    // עדכון מצב מקומי אם המיזוג שינה משהו
    if (remoteData && statesDiffer(merged, localSnapshot)) {
      items = merged.items;
      deletedIds = merged.deletedIds;
      priceMemory = merged.priceMemory;
      meta.updatedAt = merged.updatedAt;
      persistLocal();
      render();
    }

    const hasLocalEdits = localRevision !== startRev;
    const finalPayload = hasLocalEdits ? buildPayload() : merged;
    const mustWrite = !fileId || pushLocalChanges || hasLocalEdits || statesDiffer(finalPayload, remoteData);

    if (mustWrite) {
      const writeRes = await writeRemoteState(finalPayload, fileId);
      if (writeRes.needScope) {
        syncState = "need_scope";
        updateSyncBadge();
        return;
      }
      if (!writeRes.ok) {
        throw new Error("Drive write failed: " + writeRes.errStatus);
      }
    }

    syncedRevision = localRevision;
    lastSyncAt = Date.now();
    syncState = "synced";
  } catch (err) {
    syncState = "error";
  } finally {
    isSyncing = false;
    updateSyncBadge();
    if (localRevision !== syncedRevision && syncState !== "need_scope" && syncState !== "error") {
      scheduleDrivePush();
    }
  }
}

// חיפוש משולב: זיכרון מקומי מיידי + קריאה חיה לרמי לוי דרך ה-Worker
async function handleSearchInput(q) {
  const term = q.trim();
  const seq = ++searchSeq;
  if (term.length < 2) {
    closeDropdown();
    return;
  }

  const localMatches = Object.values(priceMemory)
    .filter((m) => m.name.toLowerCase().includes(term.toLowerCase()))
    .slice(0, 4)
    .map((m) => ({ ...m, source: "זיכרון מחירים" }));

  renderDropdown(localMatches, true);

  try {
    const res = await fetch(`${WORKER_BASE}/rami?q=${encodeURIComponent(term)}`);
    const data = await res.json();
    if (seq !== searchSeq) return;

    if (data.ok && Array.isArray(data.items) && data.items.length > 0) {
      const liveMatches = data.items.map((it) => ({
        name: it.name,
        price: it.price,
        oldPrice: it.oldPrice,
        dept: classifyDepartment(it.name, it.department),
        source: "רמי לוי אונליין"
      }));
      renderDropdown(liveMatches, false);
    } else if (localMatches.length > 0) {
      renderDropdown(localMatches, false);
    } else {
      showManualDropdownOption(term);
    }
  } catch {
    if (seq !== searchSeq) return;
    if (localMatches.length > 0) {
      renderDropdown(localMatches, false);
    } else {
      showManualDropdownOption(term);
    }
  }
}

function showManualDropdownOption(term) {
  const dd = $("shop-dropdown");
  dd.innerHTML = `<div class="shop-dd-item" data-manual-add="1">
    <div><strong>הוסף "${esc(term)}" ידנית</strong><div class="shop-dd-meta">ללא התאמה באונליין • ישויך אוטומטית למחלקה</div></div>
    <span class="shop-dd-price">+ הוסף</span>
  </div>`;
  dd.classList.add("open");
  dd.querySelector("[data-manual-add]")?.addEventListener("click", () => {
    addItem({ name: $("shop-search-input").value });
  });
}

function renderDropdown(list, isLoadingMore) {
  const dd = $("shop-dropdown");
  if (!list.length && !isLoadingMore) {
    closeDropdown();
    return;
  }
  let html = list.map((it, idx) => `
    <div class="shop-dd-item" data-idx="${idx}">
      <div style="min-width:0;">
        <div style="font-weight:600; font-size:13.5px;">${esc(it.name)}</div>
        <div class="shop-dd-meta">${esc(it.dept)} • ${esc(it.source)}</div>
      </div>
      <div class="shop-dd-price">
        ${it.oldPrice ? `<span class="shop-dd-old">${fmt(it.oldPrice)}</span>` : ""}
        ${fmt(it.price)}
      </div>
    </div>
  `).join("");

  if (isLoadingMore) {
    html += `<div style="padding:8px 14px; font-size:12px; color:var(--mut,#6b7280); text-align:center;">מחפש מחירים עדכניים ברמי לוי...</div>`;
  }

  dd.innerHTML = html;
  dd.classList.add("open");

  dd.querySelectorAll(".shop-dd-item").forEach((el, i) => {
    el.onclick = () => addItem(list[i]);
  });
}

function closeDropdown() {
  searchSeq++;
  $("shop-dropdown").classList.remove("open");
}

function renderItemRow(item) {
  const lineTotal = item.price * item.qty;
  return `
    <div class="shop-item ${item.done ? "done" : ""}" data-id="${esc(item.id)}">
      <button class="shop-check" data-act="toggle" type="button" title="סמן נקנה">${item.done ? "✓" : ""}</button>
      <div class="shop-mid">
        <div class="shop-name">${esc(item.name)}</div>
        <div class="shop-controls">
          <button class="shop-unit-btn" data-act="edit-price" type="button">
            ${item.price > 0 ? `${fmt(item.price)} ליח׳ ✎` : "הזן מחיר ✎"}
          </button>
          <div class="shop-qty-box">
            <button class="shop-qty-btn" data-act="dec" type="button">−</button>
            <span class="shop-qty-val">${item.qty}</span>
            <button class="shop-qty-btn" data-act="inc" type="button">+</button>
          </div>
        </div>
      </div>
      <div class="shop-end">
        <div class="shop-line-total">${fmt(lineTotal)}</div>
        <button class="shop-del-btn" data-act="del" type="button">הסר</button>
      </div>
    </div>
  `;
}

function deptSortIndex(dept) {
  const idx = DEPT_ORDER.indexOf(dept);
  if (idx !== -1) return idx;
  if (dept === "📦 כללי") return DEPT_ORDER.length + 1;
  return DEPT_ORDER.length;
}

function render() {
  const totalAll = items.reduce((s, i) => s + i.price * i.qty, 0);
  const totalLeft = items.filter((i) => !i.done).reduce((s, i) => s + i.price * i.qty, 0);
  const doneCount = items.filter((i) => i.done).length;

  $("shop-total-all").textContent = fmt(totalAll);
  $("shop-total-left").textContent = fmt(totalLeft);
  $("shop-progress").textContent = `${doneCount}/${items.length}`;
  $("shop-float-all").textContent = fmt(totalAll);
  $("shop-float-left").textContent = fmt(totalLeft);

  const todoItems = items.filter((i) => !i.done);
  const doneItems = items.filter((i) => i.done);

  const groupsContainer = $("shop-groups-container");
  if (currentFilter === "done") {
    groupsContainer.innerHTML = "";
  } else if (todoItems.length === 0) {
    groupsContainer.innerHTML = `<div class="card" style="text-align:center; padding:24px; color:var(--mut,#6b7280);">אין פריטים ממתינים ברשימה 🎉</div>`;
  } else {
    const byDept = {};
    todoItems.forEach((it) => {
      const d = it.dept || "📦 כללי";
      if (!byDept[d]) byDept[d] = [];
      byDept[d].push(it);
    });

    const sortedDepts = Object.entries(byDept).sort(
      (a, b) => deptSortIndex(a[0]) - deptSortIndex(b[0])
    );

    groupsContainer.innerHTML = sortedDepts.map(([dept, list]) => {
      const deptSum = list.reduce((s, i) => s + i.price * i.qty, 0);
      return `
        <details class="card ct shop-dept" open>
          <summary>
            <span>${esc(dept)} (${list.length})</span>
            <span class="shop-dept-sub">${fmt(deptSum)}</span>
          </summary>
          <div>${list.map(renderItemRow).join("")}</div>
        </details>
      `;
    }).join("");
  }

  const doneContainer = $("shop-done-container");
  if (currentFilter === "todo" || doneItems.length === 0) {
    doneContainer.innerHTML = "";
  } else {
    const doneSum = doneItems.reduce((s, i) => s + i.price * i.qty, 0);
    doneContainer.innerHTML = `
      <details class="card ct shop-dept" open>
        <summary>
          <span>✅ בעגלה / נקנה (${doneItems.length})</span>
          <span class="shop-dept-sub">${fmt(doneSum)}</span>
        </summary>
        <div>${doneItems.map(renderItemRow).join("")}</div>
      </details>
    `;
  }
}

// מאזיני אירועים
$("shop-sync-btn")?.addEventListener("click", () => {
  if (syncState === "need_scope") {
    window._driveAuth?.reauth();
    return;
  }
  const auth = window._driveAuth;
  if (!auth || (!auth.getToken() && !localStorage.getItem("rt"))) {
    auth?.login();
    return;
  }
  syncWithDrive(true);
});

$("shop-search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => handleSearchInput(e.target.value), 280);
});

$("shop-search-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    addItem({ name: e.target.value });
  }
});

$("shop-manual-add").addEventListener("click", () => {
  addItem({ name: $("shop-search-input").value });
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".shop-search-wrap")) closeDropdown();

  const row = e.target.closest(".shop-item");
  if (!row) return;
  const item = items.find((i) => i.id === row.dataset.id);
  if (!item) return;

  const actBtn = e.target.closest("[data-act]");
  const act = actBtn?.dataset.act;
  if (!act) return;

  if (act === "toggle") {
    item.done = !item.done;
    item.updatedAt = Date.now();
    saveState();
  }
  if (act === "inc") {
    item.qty += 1;
    item.updatedAt = Date.now();
    saveState();
  }
  if (act === "dec") {
    if (item.qty > 1) {
      item.qty -= 1;
      item.updatedAt = Date.now();
    } else {
      markDeleted(item.id);
      items = items.filter((i) => i.id !== item.id);
    }
    saveState();
  }
  if (act === "del") {
    markDeleted(item.id);
    items = items.filter((i) => i.id !== item.id);
    saveState();
  }
  if (act === "edit-price") {
    const raw = prompt(`מחיר ליחידה עבור "${item.name}":`, item.price || "");
    if (raw !== null) {
      const parsed = parseFloat(raw.trim().replace(",", "."));
      if (!isNaN(parsed)) {
        item.price = Math.max(0, Math.round(parsed * 100) / 100);
        item.updatedAt = Date.now();
        rememberProduct(item.name, item.price, item.dept);
        saveState();
      }
    }
  }
});

document.querySelectorAll(".shop-pill[data-filter]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".shop-pill[data-filter]").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

$("shop-clear-done").addEventListener("click", () => {
  if (items.some((i) => i.done) && confirm("למחוק את כל הפריטים שכבר סומנו כנקנו?")) {
    items.filter((i) => i.done).forEach((i) => markDeleted(i.id));
    items = items.filter((i) => !i.done);
    saveState();
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && typeof S !== "undefined" && S.tab === "shop") {
    syncWithDrive(false);
  }
});

window.getShoppingState = () => buildPayload();
window.setShoppingState = (state) => {
  if (!state) return;
  const merged = mergeStates(buildPayload(), state);
  items = merged.items;
  deletedIds = merged.deletedIds;
  priceMemory = merged.priceMemory;
  meta.updatedAt = merged.updatedAt;
  saveState(true);
};
window._shopRender = render;
window._shopSyncPull = (pushIfDirty = false) => syncWithDrive(pushIfDirty);
window._shopOnAuth = () => {
  if (syncState === "need_scope") syncState = "idle";
  syncWithDrive(true);
};

render();
updateSyncBadge();
if (window._driveAuth && (window._driveAuth.getToken() || localStorage.getItem("rt"))) {
  syncWithDrive(false);
}
})();
</script></body></html>
