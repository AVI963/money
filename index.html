<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#090d16" media="(prefers-color-scheme:dark)">
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){document.documentElement.dataset.theme=t;var c=t==='dark'?'#090d16':'#f4f6fa';document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=c})}}catch(e){}})();</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>הכסף שלי</title>
<link rel="stylesheet" href="style.css"></head><body>
<main id="app"><div id="splash"><div class="logo-badge"><svg viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></div><h1>הכסף שלי</h1><p class="mut">הנתונים נקראים ישירות מהדרייב שלך ולא נשמרים בשום מקום אחר.</p><button class="go" data-sync>התחברות עם Google</button></div></main>

<div id="page-shopping" class="page" style="display:none;">
  <div class="card hg">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
      <span style="font-weight:800; font-size:17px;">🛒 רשימת קניות חכמה</span>
      <button id="shop-sync-pill" class="sync-pill off" type="button" title="לחץ לסנכרון מול Google Drive"><i></i><span id="shop-sync-txt">מקומי בלבד</span></button>
    </div>
    <div class="shop-hero-grid">
      <div class="shop-hero-box">
        <div class="shop-hero-lbl">סה״כ עגלה</div>
        <div class="shop-hero-val" id="shop-total-all">₪0.00</div>
      </div>
      <div class="shop-hero-box">
        <div class="shop-hero-lbl">נשאר לאסוף</div>
        <div class="shop-hero-val" id="shop-total-left">₪0.00</div>
      </div>
      <div class="shop-hero-box">
        <div class="shop-hero-lbl">התקדמות</div>
        <div class="shop-hero-val" id="shop-progress">0/0</div>
      </div>
    </div>
  </div>

  <div id="shop-share-banner" class="shop-share-tip" style="display:none;"></div>

  <div class="shop-search-wrap">
    <div class="shop-search-row">
      <input id="shop-search-input" class="shop-search-input" type="text"
             placeholder="חפש מוצר ברמי לוי או הקלד להוספה..." autocomplete="off">
      <button id="shop-manual-add" class="shop-add-btn" type="button">+ הוסף</button>
    </div>
    <div id="shop-dropdown" class="shop-dropdown"></div>
  </div>

  <div class="shop-filters">
    <button class="shop-pill active" data-filter="all" type="button">הכל</button>
    <button class="shop-pill" data-filter="todo" type="button">לא נקנה</button>
    <button class="shop-pill" data-filter="done" type="button">נקנה ✓</button>
    <button id="shop-share-btn" class="shop-pill" style="margin-inline-start:auto;" type="button" title="שתף רשימה בדרייב">👥 שתף</button>
    <button id="shop-clear-done" class="shop-pill" style="color:var(--bad);" type="button">נקה שנקנו</button>
  </div>

  <div id="shop-groups-container"></div>
  <div id="shop-done-container" style="margin-top: 14px;"></div>

  <div class="sl-float" id="shop-float-bar" data-up-top>
    <span>נותר לשלם: <strong id="shop-float-left">₪0.00</strong></span>
    <span>סה״כ: <strong id="shop-float-all">₪0.00</strong></span>
  </div>

  <div id="shop-price-modal" class="ms-back" style="display:none;">
    <div class="ms-sheet" style="max-width:440px;">
      <div class="ms-grab"></div>
      <div class="row" style="padding:0 0 6px">
        <h2 style="margin:0;font-size:16px;" id="shop-pm-title">עדכון מחיר</h2>
        <button type="button" class="chip2" id="shop-pm-close" style="padding:4px 10px;font-size:12px">✕</button>
      </div>
      <label class="wf-lbl" for="shop-pm-input">מחיר ליחידה (₪)</label>
      <input id="shop-pm-input" class="wf-inp" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
      <div class="row" style="margin-top:14px;padding:0;gap:8px">
        <button type="button" class="pr" id="shop-pm-save" style="flex:1;background:var(--g);color:#fff;padding:11px">שמור מחיר ✓</button>
        <button type="button" class="chip2" id="shop-pm-cancel" style="padding:10px 15px">ביטול</button>
      </div>
    </div>
  </div>
</div>

<div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>

<nav hidden>
  <button data-t="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9 20v-6h6v6"/></svg>בית</button>
  <button data-t="pv"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 5-6"/></svg>ניתוח</button>
  <button data-t="inv"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M2 9h20"/><path d="m12 21 4-12-4-6-4 6Z"/></svg>נכסים</button>
  <button data-t="shop"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>קניות</button>
  <button data-t="more"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>עוד</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js" defer></script>
<script src="shop.js" defer></script>
</body></html>
מנתח את הנתונים
